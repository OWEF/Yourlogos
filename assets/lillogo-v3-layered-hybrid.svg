<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" role="img" aria-labelledby="rigTitle rigDescription" id="lillogoLayeredRig" class="state-idle">
<title id="rigTitle">LilLogo — experimental layered hybrid master</title>
<desc id="rigDescription">Original YourLogos portrait separated into an occlusion-cleared body base, head, artist-paint eye extracts, eyelid overlays and independent forelock layer. Designed for subtle motion; visual fidelity awaits founder approval. The source image remains a raster.</desc>
<metadata>Source: OWEF/Yourlogos little-logo-hd-v2.jpg; design reference: Linear CZ-23. CZ-81 B1c PROTOTYPE, not a verified pure-vector master. Layer positions and occlusion masks are editable SVG geometry. No external requests, models or tracking.</metadata>
<defs>
  <!-- Embedded unmodified, approved-raster portrait once; reusable through SVG <use>. -->
  <image id="originalPortrait" x="0" y="0" width="400" height="400" preserveAspectRatio="xMidYMid meet" href="data:image/jpeg;base64," />
  <path id="headGeometry" d="M145 96 C176 74 223 70 269 76 C320 75 366 109 375 151 C381 185 364 221 342 244 C313 268 270 273 232 258 C193 248 160 220 147 195 C135 166 133 126 145 96 Z"/>
  <path id="forelockGeometry" d="M60 166 C80 151 77 133 91 121 C108 110 115 87 145 76 C169 61 177 41 215 47 C230 28 256 31 276 46 C308 38 343 54 358 77 C367 91 365 103 378 122 C370 138 371 165 355 184 C365 157 352 131 341 118 C329 104 294 88 273 91 C237 77 205 97 180 117 C155 136 150 154 128 176 C106 198 80 207 62 207 C92 189 103 176 112 159 C94 175 76 175 60 166 Z"/>
  <clipPath id="headClip" clipPathUnits="userSpaceOnUse"><use href="#headGeometry"/></clipPath>
  <clipPath id="forelockClip" clipPathUnits="userSpaceOnUse"><use href="#forelockGeometry"/></clipPath>
  <clipPath id="underpaintClip" clipPathUnits="userSpaceOnUse">
    <use href="#headGeometry"/><use href="#forelockGeometry"/>
  </clipPath>
  <filter id="softUnderpaint" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
  <clipPath id="eyeClip" clipPathUnits="userSpaceOnUse">
    <ellipse cx="253" cy="169" rx="15.2" ry="22.5"/>
    <ellipse cx="330" cy="164" rx="13.4" ry="20.5"/>
  </clipPath>
  <mask id="bodyHeadKnockout" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
    <rect width="400" height="400" fill="#fff"/>
    <use href="#headGeometry" fill="#000"/>
    <use href="#forelockGeometry" fill="#000"/>
  </mask>
  <mask id="eyeRemoval" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
    <rect width="400" height="400" fill="#fff"/>
    <ellipse cx="253" cy="169" rx="15.2" ry="22.5" fill="#000"/>
    <ellipse cx="330" cy="164" rx="13.4" ry="20.5" fill="#000"/>
  </mask>
  <radialGradient id="eyeSkin" cx="32%" cy="22%" r="86%">
    <stop offset="0" stop-color="#ffebce"/>
    <stop offset=".65" stop-color="#ebcbaa"/>
    <stop offset="1" stop-color="#c8a082"/>
  </radialGradient>
  <style><![CDATA[
    #headRig,#hairRig,#eyeRig,#eyelids{transform-box:view-box;transition:transform .48s cubic-bezier(.21,.75,.2,1)}
    #headRig{transform-origin:265px 244px}
    #hairRig{transform-origin:238px 107px;transition-duration:.72s}
    #eyeRig{transform-origin:292px 168px;transition-duration:.36s}
    #lillogoLayeredRig.state-curious #headRig{transform:rotate(2deg) translate(-1.5px,-2px)}
    #lillogoLayeredRig.state-curious #eyeRig{transform:translate(1.8px,-.6px)}
    #lillogoLayeredRig.state-curious #hairRig{transform:rotate(-1.35deg) translate(.6px,-1.2px)}
    /* Quiet companion states; no exaggerated jumps or body-bouncing. */
    #lillogoLayeredRig.state-reflective #headRig{transform:rotate(-.9deg) translateY(.5px)}
    #lillogoLayeredRig.state-reflective #eyeRig{transform:translate(-.6px,.4px)}
    #lillogoLayeredRig.state-restful #headRig{transform:rotate(-.5deg)}
    #lillogoLayeredRig.state-restful #hairRig{transform:rotate(.4deg)}
    #lillogoLayeredRig.state-quietly-delighted #headRig{transform:rotate(1.4deg) translateY(-1.1px)}
    #lillogoLayeredRig.state-quietly-delighted #eyeRig{transform:translate(.2px,-.8px)}
    #lillogoLayeredRig.state-quietly-delighted #hairRig{transform:rotate(-.75deg)}

    #eyelids{transform-origin:292px 167px;transform:scaleY(0)}
    #lillogoLayeredRig:not(.is-paused) #eyelids{animation:quietBlink 9s linear infinite}
    @keyframes quietBlink{0%,92%,95%,100%{transform:scaleY(0)}93.1%,94%{transform:scaleY(1)}}
    #lillogoLayeredRig.is-paused *{animation-play-state:paused!important}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
      #eyelids{transform:scaleY(0)!important}
    }
  ]]></style>
</defs>
<!-- Editable layer 1: source portrait with head/forelock physically knocked out;
     no hidden second face to ghost when head moves. -->
<g id="bodyBase" data-editable-layer="body-static-with-head-knockout">
  <use href="#originalPortrait" mask="url(#bodyHeadKnockout)"/>
</g>
<!-- Editable layer 2: subdued underpainting for revealed pixels during head motion.
     IMPORTANT: occluded anatomy is approximated; human art review required. -->
<g id="neckUnderpaint" data-editable-layer="occlusion-restoration-provisional" clip-path="url(#underpaintClip)">
  <!-- The source-colour, blurred underpainting fills pixels exposed by tiny
       head pivots. This avoids a solid DARK CIRCULAR SEAM at the face contour.
       It is still provisional; edge/occlusion art requires human approval. -->
  <use href="#originalPortrait" filter="url(#softUnderpaint)"/>
</g>
<!-- Editable layer 3: head/face from the SAME original image; rotates around neck. -->
<g id="headRig" data-editable-layer="head-independent">
  <g clip-path="url(#headClip)">
    <use href="#originalPortrait" mask="url(#eyeRemoval)"/>
  </g>
  <g id="eyeBackground" data-editable-layer="eyelid-reveal-underpaint">
    <ellipse cx="253" cy="169" rx="15.2" ry="22.5" fill="url(#eyeSkin)"/>
    <ellipse cx="330" cy="164" rx="13.4" ry="20.5" fill="url(#eyeSkin)"/>
  </g>
  <!-- Editable layer 4: actual source-image eyes are clipped and moved separately. -->
  <g id="eyeRig" data-editable-layer="eyes-independent" clip-path="url(#eyeClip)">
    <use href="#originalPortrait"/>
  </g>
  <!-- Editable layer 5: pale lid overlays close briefly, separately from the face. -->
  <g id="eyelids" data-editable-layer="blink-independent">
    <ellipse cx="253" cy="169" rx="15.1" ry="22.2" fill="url(#eyeSkin)"/>
    <ellipse cx="330" cy="164" rx="13.3" ry="20.2" fill="url(#eyeSkin)"/>
    <path d="M240 170 Q253 174 266 170 M318 165 Q330 169 341 165" stroke="#9b755a" stroke-width="1" fill="none" opacity=".8"/>
  </g>
</g>
<!-- Editable layer 6: original hair/forelock extract; pivots separately. -->
<g id="hairRig" data-editable-layer="forelock-independent" clip-path="url(#forelockClip)">
  <use href="#originalPortrait"/>
</g>
</svg>