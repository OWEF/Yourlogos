# CZ-79: supervised Backend & APIs micro-fix; no production authority.
# Only trusted owner title transition on GitHub issue #112 may trigger this workflow.
name: CZ-79 Kimi B choice validation bounded pilot

on:
  issues:
    types: [edited]

permissions: {}

jobs:
  kimi-implementation:
    if: >-
      github.repository == 'OWEF/Yourlogos' &&
      github.actor == 'OWEF' &&
      github.event.issue.user.login == 'OWEF' &&
      github.event.issue.number == 112 &&
      github.event.issue.pull_request == null &&
      github.event.issue.title == '[RUN-CZ79-KIMI-B] Reject overlength Encounter lens choices without truncating' &&
      github.event.changes.title.from == '[CZ79-BACKEND-IDLE] Reject overlength Encounter lens choices without truncating'
    runs-on: ubuntu-24.04
    concurrency:
      group: cz-69-kimi-coding
      cancel-in-progress: false
    timeout-minutes: 7
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
    steps:
      - name: Checkout trusted default branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: CZ75 manual quota and billing attestation (no model)
        shell: bash
        env:
          CZ75_MANUAL_QUOTA_READY: ${{ vars.CZ75_MANUAL_QUOTA_READY }}
        run: |
          set -euo pipefail
          if [[ "$CZ75_MANUAL_QUOTA_READY" != "true" ]]; then
            echo "::error::CZ75 HOLD: quota status and Extra Usage setting require operator review"
            echo "Check Kimi membership credit usage, current 5-hour capacity, and confirm Extra Usage is OFF."
            echo "Then set GitHub Actions repository variable CZ75_MANUAL_QUOTA_READY=true."
            exit 1
          fi
          echo 'Founder-managed quota and billing attestation present; this is NOT provider-verified telemetry.'
          node .github/scripts/cz75-readiness-gate.mjs .github/workflows/cz79-kimi-backend-pilot.yml

      - name: Install pinned Kimi CLI before exposing membership key
        run: |
          set -euo pipefail
          npm install --global '@moonshot-ai/kimi-code@2.4.1'
          kimi --version
          # This check is offline and requires no membership key or model call.
          # Prevent an unsupported CLI flag from consuming a coding attempt.
          kimi --help | grep -q -- '--prompt'
          kimi --help | grep -q -- '--output-format'
          kimi --help | grep -q -- '--agent-file'
          node .github/scripts/cz69-role-router.mjs --check
          test "$(node .github/scripts/cz69-role-router.mjs backend-apis)" = '.github/kimi/profiles/backend-apis.md'
          node --check .github/scripts/cz69-safe-report.mjs
          node --test .github/scripts/cz69-safe-report.test.mjs
          cp .github/scripts/cz69-safe-report.mjs "$RUNNER_TEMP/cz69-safe-report.mjs"

      - name: Run one bounded Kimi B backend validation fix without GitHub write token
        id: model
        shell: bash
        timeout-minutes: 4
        env:
          KIMI_MODEL_NAME: kimi-for-coding
          KIMI_MODEL_PROVIDER_TYPE: kimi
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_CODE_HOME: ${{ runner.temp }}/cz69-kimi-home
          KIMI_CODE_TRUST_WORKSPACE: 'true'
          KIMI_LOOP_MAX_STEPS_PER_TURN: '8'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '1'
          KIMI_CODE_INFINITE_RETRY: 'false'
          KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: 'exit'
          KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: '1'
          KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: '45'
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ -z "${KIMI_MODEL_API_KEY:-}" ]]; then
            echo "::error::Required KIMI_CODE_API_KEY secret is absent"
            exit 1
          fi
          mkdir -p "$KIMI_CODE_HOME"
          # Trusted, fixed task; issue title/body and PR content are NEVER injected.
          # Backend role denies Bash/delegation, but this is not a full
          # OS sandbox. No live app secrets or public issue bodies supplied.
          prompt=$(cat <<'TASK'
          You are Kimi B, YourLogos Backend & APIs specialist.
          One bounded task under CZ-13 / CZ-79 / GitHub issue #112.
          In discover-ai-server.mjs validateDiscoverTurn() currently does
          .map(x=>clip(x,82)) before rejecting choices >82 chars.
          Because clip truncates long strings, validation cannot reject
          those overlength model choices; the UI may display cut-off text.
          FIRST add tests/discover-choice-length.test.mjs with 2-4
          deterministic Node node:test + assert/strict cases:
          opening with three distinct valid choices should pass;
          raw option >82 chars should fail instead of silently truncate;
          final turn still requires no choices and a valid question.
          THEN minimally fix discover-ai-server.mjs so choices are
          trimmed but oversized raw model choices are rejected.
          Preserve original accepted max82, error contract and retry logic.
          Touch ONLY discover-ai-server.mjs and the new test file.
          Do not modify APIs, auth, rate limits, quote catalogue, prompts,
          tests outside the new file, DB, server routing or UI.
          Do not use Bash, commands, env variables, secrets, networks,
          other agents, GitHub push, deployments or external services.
          CI independently executes Node tests. Keep test <95 lines.
          Return brief outcome or explain any blocker; stop.
          TASK
          )
          # Phase 1 micro-pilot: 8 agent steps per turn, 1 failed-step attempt,
          # no automatic retries, 150-second hard process timeout.
          # These are execution caps, not verified token or dollar ceilings.
          start_seconds=$SECONDS
          set +e
          timeout --signal=TERM --kill-after=5s 150s \
            kimi --agent-file .github/kimi/profiles/backend-apis.md -p "$prompt" --output-format stream-json \
            > "$RUNNER_TEMP/kimi-stdout.jsonl" 2> "$RUNNER_TEMP/kimi-stderr.txt"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "elapsed_sec=$((SECONDS-start_seconds))" >> "$GITHUB_OUTPUT"
          echo "Kimi process stopped; raw model output intentionally withheld."
          # Never automatically retry after a failure or hard timeout.

      - name: Generate bounded sanitized diagnostics, even on timeout
        if: always()
        shell: bash
        env:
          MODEL_RC: ${{ steps.model.outputs.exit_code || 'missing' }}
          MODEL_SECONDS: ${{ steps.model.outputs.elapsed_sec || '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cz69-safe"
          if [[ -f "$RUNNER_TEMP/cz69-safe-report.mjs" ]]; then
            node "$RUNNER_TEMP/cz69-safe-report.mjs" \
              "$RUNNER_TEMP/kimi-stdout.jsonl" "$RUNNER_TEMP/kimi-stderr.txt" \
              "$MODEL_RC" "$MODEL_SECONDS" "$RUNNER_TEMP/cz69-safe/report.json"
          else
            printf '%s\n' '{"schema":"cz69-harness-diagnostics-v1","exitClass":"not_started","safeFieldsOnly":true,"usage":"not_verified"}' \
              > "$RUNNER_TEMP/cz69-safe/report.json"
          fi
          node -e '
            const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));
            if (r.safeFieldsOnly !== true) process.exit(1);
            console.log("CZ-69 sanitized outcome: "+r.exitClass);
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### CZ-69 sanitized model-run evidence\n" +
              "- Exit class: "+r.exitClass+"\n" +
              "- Duration: "+(r.elapsedSeconds ?? "not started")+" seconds\n" +
              "- Model usage: not verified\n" +
              "- No raw prompts, model replies, tools, paths or credentials published\n");
          ' "$RUNNER_TEMP/cz69-safe/report.json"

      - name: Upload safe timeout evidence (never raw agent logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cz69-safe-diagnostics
          path: ${{ runner.temp }}/cz69-safe/report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Fail closed when Kimi did not complete
        if: steps.model.outputs.exit_code != '0'
        run: |
          echo "::error::Kimi did not finish; no code validation or draft PR"
          exit 1

      - name: Validate scope and run tests with no Kimi credentials
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              discover-ai-server.mjs|tests/discover-choice-length.test.mjs) ;;
              *) echo "::error::Out-of-scope file changed: $file"; exit 1 ;;
            esac
          done < <(git status --porcelain | cut -c4-)
          git diff --check
          if git diff --quiet -- discover-ai-server.mjs; then
            echo '::error::No strict server validation fix was produced'
            exit 1
          fi
          if [[ ! -f tests/discover-choice-length.test.mjs ]]; then
            echo "::error::Expected fresh regression test was not created"
            exit 1
          fi
          node --check discover-ai-server.mjs
          node --test tests/discover-choice-length.test.mjs tests/discover-encounter.test.mjs tests/discover-quote-schema.test.mjs
          node scripts/verify-v24.mjs
          mkdir -p "$RUNNER_TEMP/candidate/tests"
          cp tests/discover-choice-length.test.mjs "$RUNNER_TEMP/candidate/tests/"
          cp discover-ai-server.mjs "$RUNNER_TEMP/candidate/discover-ai-server.mjs"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo '### CZ-79 Kimi B candidate passed scoped validation' >> "$GITHUB_STEP_SUMMARY"
            echo '- Only server validation logic and one offline test changed' >> "$GITHUB_STEP_SUMMARY"
            echo '- Regression and V2.4 tests passed, no production operation' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No changes after Kimi analysis; do not create a PR.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate for independent review (no credentials)
        if: steps.validate.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cz79-backend-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 3

  open-draft-pr:
    name: Stage scoped patch as an unmerged draft PR
    needs: kimi-implementation
    if: needs.kimi-implementation.result == 'success' && needs.kimi-implementation.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main, without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch only the candidate artifact from the preceding job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cz79-backend-candidate
          path: ${{ runner.temp }}/cz79-candidate/
      - name: Check artifact paths and create isolated draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/cz79-backend-pilot-${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f "$RUNNER_TEMP/cz79-candidate/tests/discover-choice-length.test.mjs"
          test -f "$RUNNER_TEMP/cz79-candidate/discover-ai-server.mjs"
          cp "$RUNNER_TEMP/cz79-candidate/tests/discover-choice-length.test.mjs" tests/
          cp "$RUNNER_TEMP/cz79-candidate/discover-ai-server.mjs" discover-ai-server.mjs
          git diff --check
          if git diff --quiet -- discover-ai-server.mjs; then
            echo '::error::No backend source fix in candidate artifact'
            exit 1
          fi
          files="$(git status --porcelain | cut -c4-)"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              discover-ai-server.mjs|tests/discover-choice-length.test.mjs) ;;
              *) echo "::error::Unexpected candidate path: $file"; exit 1 ;;
            esac
          done <<< "$files"
          if [[ -z "$files" ]]; then
            echo "::error::Candidate patch contained no changes"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- discover-ai-server.mjs tests/discover-choice-length.test.mjs
          git commit -m 'fix(cz-79): reject oversized Encounter lens choices'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title 'fix(cz-79): strict Encounter lens choice length validation' \
            --body 'Kimi B Backend and APIs candidate for [Linear CZ-79](https://linear.app/czd217/issue/CZ-79/kimi-b-pilot-reject-overlength-encounter-choices-instead-of-truncating) and [GitHub #112](https://github.com/OWEF/Yourlogos/issues/112). Scope: one narrowly scoped Discover server validation fix and one offline regression test. Explicit backend-apis profile, source allowlist, read-only GitHub token in model job and independent Node/V2.4 CI. **DO NOT MERGE OR DEPLOY** without founder release decision and tech-lead review.'
          echo '### CZ-79 backend draft PR staged' >> "$GITHUB_STEP_SUMMARY"
          echo '- Await independent tech-lead code review and founder release approval' >> "$GITHUB_STEP_SUMMARY"
