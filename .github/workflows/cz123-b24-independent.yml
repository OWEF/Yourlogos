name: CZ-123 B2.4 independent exact-SHA final Encounter
on:
  push:
    branches: [qa/cz123-b24-coherent-encounter-final-v1]
  pull_request:
    paths:
      - "tests/yl-b24-independent-holdouts.test.mjs"
      - "tests/yl-b24-independent-browser.test.mjs"
      - "tests/yl-b23-final-independent-browser.test.mjs"
      - ".github/workflows/cz123-b24-independent.yml"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Exact production-unmodified QA-only base
        run: |
          set -euo pipefail
          BASE=5bb9b69d695b713b91cd947c1b7aba4fabe233a0
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/qa_files
          while IFS= read -r f; do
            case "$f" in
              tests/yl-b24-independent-holdouts.test.mjs|tests/yl-b24-independent-browser.test.mjs|tests/yl-b23-final-independent-browser.test.mjs|.github/workflows/cz123-b24-independent.yml) ;;
              *) echo "QA authored or modified implementation: $f"; exit 1 ;;
            esac
          done </tmp/qa_files
      - name: Independent meaning source and v2-compatible Emotion/Expression holdouts
        run: node --test tests/yl-b24-independent-holdouts.test.mjs
      - name: Install no-cost browser
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Independent CZ-133 section II and six game browser checks
        run: node --test tests/yl-b24-independent-browser.test.mjs
      - name: Re-run independently accepted B2.3 source/browser holdout
        run: node --test tests/yl-b23-final-independent-browser.test.mjs
      - name: Reviewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz123-b24-independent-philosopher-card-screenshots
          path: qa-evidence/
          if-no-files-found: warn
      - name: Frozen accepted six-game and source regressions
        run: node --test tests/yl-b24-coherent-encounter.test.mjs tests/yl-b23-founder-six-peer.test.mjs tests/yl-milestone-a.test.mjs tests/yl-b1-editorial-gated.test.mjs
