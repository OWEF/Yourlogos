name: CZ-140 Encounter v2.1 progressive Swipe Decision research
on:
  push:
    branches:
      - feature/cz140-progressive-swipe-pilot
  pull_request:
    paths:
      - "experiments/encounter-v21-progressive*"
      - "scripts/build-encounter-v21-progressive.mjs"
      - "tests/encounter-v21-progressive-browser.mjs"
      - ".github/workflows/encounter-v21-progressive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progressive-swipe-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frozen engine source parity plus new standalone export check
        run: |
          node --check scripts/build-encounter-v21.mjs
          node --check scripts/build-encounter-v21-progressive.mjs
          node scripts/build-encounter-v21.mjs --check
          node scripts/build-encounter-v21-progressive.mjs --check
          node scripts/build-encounter-v20.mjs --check
      - name: Existing v2.0 semantic reasoning and v2.1 Token Studio regression
        run: |
          node --test tests/encounter-v20.test.mjs tests/semantic-v12.test.mjs tests/semantic-v19-admission.test.mjs
      - name: Install isolated browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Earlier Token Studio acceptance tests
        run: node tests/encounter-v21-browser.mjs
      - name: New branch-dependent Swipe Decision and progressive screen tests
        run: node tests/encounter-v21-progressive-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cz140-progressive-swipe-html-mobile-evidence
          path: |
            experiments/encounter-v21-progressive.html
            artifacts/cz140-*.png
          if-no-files-found: warn
