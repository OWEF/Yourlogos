name: CZ-147 R2 Philosophical Operation Fidelity
on:
  push:
    branches: [feature/cz147-r2-operation-fidelity, qa/cz147-r2-independent, feature/cz147-r2-compact-holdout-correction, qa/cz147-r2-final-independent]
  pull_request:
    paths:
      - "experiments/yl-cz147-engines.mjs"
      - "experiments/yl-cz147-sources.mjs"
      - "tests/yl-cz147-r2-*"
      - ".github/workflows/cz147-r2.yml"
permissions:
  contents: read
jobs:
  source-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: General source validation and no philosopher name branches
        run: |
          node --check experiments/yl-cz147-engines.mjs
          node --check experiments/yl-cz147-sources.mjs
          node --check tests/yl-cz147-r2-operation.test.mjs
          node -e "const x=require('fs').readFileSync('experiments/yl-cz147-engines.mjs','utf8');for(const name of ['Kierkegaard','Seneca','Emerson','Wollstonecraft','Epictetus','Thoreau','Dillard','Smith','Laozi','Pascal'])if(x.includes(name))throw Error('Named philosopher hardcoded in shared engine: '+name)"
      - name: R2 same-family philosophical operation and 4 R1 same-source choice contrasts
        run: |
          node --test tests/yl-cz147-r2-operation.test.mjs tests/yl-cz147-r1-contrasts.test.mjs
      - name: Exposed Epicurus/Aristotle 20-state regression — not fresh holdout
        run: node --test tests/yl-cz147-r2-exposed-epicurus-regression.test.mjs
      - name: Complete shared-engine reachable-state and legacy contract regressions
        run: |
          node --test tests/yl-cz147-engine.test.mjs
          node --test tests/yl-b27-quote-compact.test.mjs tests/yl-b27-app-storage.test.mjs
          node --test tests/yl-b26-four-family-functional.test.mjs tests/yl-b26-four-family-contract.test.mjs tests/yl-b25-generalized-encounter.test.mjs
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Four game families through 16 genuine 320/390/430/1024 consumer flows and My World
        run: node --test tests/yl-cz147-browser.test.mjs
      - name: Attach philosophical contrasts and preserved full/compact outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz147-r2-philosophical-operation-evidence
          path: |
            qa-evidence-cz147-r2/
            qa-evidence-cz147-r1/
            qa-evidence-cz147/
          if-no-files-found: warn
