name: CZ-152 Final Interaction Polish — Independent Visual and Semantic QA

on:
  push:
    branches:
      - qa/cz152-polish-independent-493cb147
  pull_request:
    branches:
      - feature/cz152-final-interaction-polish
    paths:
      - 'tests/cz152-polish-independent.test.mjs'
      - '.github/workflows/cz152-polish-independent.yml'

permissions:
  contents: read

jobs:
  independent-narrative-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact QA-only revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert QA source is identical to frozen engineering SHA
        shell: bash
        run: |
          set -euo pipefail
          ENGINEERING_SHA="493cb1471814fba9feb4cbeab6ae96b8e46565d6"
          git cat-file -e "$ENGINEERING_SHA"
          EDITS="$(git diff --name-only "$ENGINEERING_SHA" HEAD)"
          printf 'QA-only changes:\n%s\n' "$EDITS"
          if printf '%s\n' "$EDITS" | grep -Ev '^(tests/cz152-polish-independent.test.mjs|\.github/workflows/cz152-polish-independent.yml)$' | grep -q . ; then
            echo "::error::Independent QA changed source application code"
            exit 1
          fi
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Playwright browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Source contract and presenter regressions
        run: node --test experiments/yl-cz152-bridge.test.mjs experiments/yl-cz150-ui.test.mjs
      - name: Real-app five-source narrative and four-family visual challenge
        run: node --test tests/cz152-polish-independent.test.mjs
      - name: Upload screenshot and source/gesture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz152-final-polish-independent-evidence
          path: qa-evidence-cz152-polish/
          if-no-files-found: warn
          retention-days: 14
