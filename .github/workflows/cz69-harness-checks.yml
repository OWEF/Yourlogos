# No Kimi membership key or API calls. Runs on PR before any harness merge.
name: CZ-69 Harness Regression Checks

on:
  pull_request:
    paths:
      - '.github/scripts/cz69-safe-report.mjs'
      - '.github/scripts/cz69-safe-report.test.mjs'
      - '.github/workflows/cz69-kimi-cz17-pilot.yml'
      - '.github/workflows/cz76-kimi-qa-pilot.yml'
      - '.github/workflows/cz77-kimi-frontend-pilot.yml'
      - '.github/workflows/cz78-kimi-debugging-pilot.yml'
      - '.github/workflows/cz79-kimi-backend-pilot.yml'
      - '.github/scripts/cz78-allowlisted-diagnosis.mjs'
      - '.github/scripts/cz78-allowlisted-diagnosis.test.mjs'
      - '.github/workflows/cz69-harness-checks.yml'
      - '.github/kimi/**'
      - '.github/scripts/cz69-role-router.mjs'
      - '.github/scripts/cz69-role-router.test.mjs'

permissions:
  contents: read

jobs:
  static-harness:
    name: Validate safe diagnostics and workflow boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - name: Test diagnostics with malicious input fixtures
        run: |
          node --check .github/scripts/cz69-safe-report.mjs
          node --test .github/scripts/cz69-safe-report.test.mjs
      - name: Validate four explicitly selected specialist roles without model usage
        run: |
          node --check .github/scripts/cz69-role-router.mjs
          node .github/scripts/cz69-role-router.mjs --check
          node --test .github/scripts/cz69-role-router.test.mjs
      - name: Assert narrow test-only pilot and safe artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/cz69-kimi-cz17-pilot.yml
          grep -Fq 'github.event.issue.number == 97' "$file"
          grep -Fq -- '--output-format stream-json' "$file"
          grep -Fq 'timeout --signal=TERM --kill-after=5s 150s' "$file"
          grep -Fq 'name: cz69-safe-diagnostics' "$file"
          grep -Fq 'name: cz17-kimi-candidate' "$file"
          grep -Fq -- '--draft --base main' "$file"
          if grep -Eq 'path:.*kimi-(stdout|stderr)|gh pr merge' "$file"; then
            echo "::error::Raw model output artifact or auto merge detected"
            exit 1
          fi
          echo "CZ-69 static harness guard passed without model usage."
      - name: Check owner-only Kimi C activation boundaries (no model)
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/cz76-kimi-qa-pilot.yml
          grep -Fq 'github.event.issue.number == 103' "$file"
          grep -Fq "github.actor == 'OWEF'" "$file"
          grep -Fq 'github.event.changes.title.from' "$file"
          grep -Fq 'node .github/scripts/cz69-role-router.mjs --check' "$file"
          grep -Fq -- '--agent-file .github/kimi/profiles/testing-qa.md' "$file"
          grep -Fq "KIMI_LOOP_MAX_STEPS_PER_TURN: '8'" "$file"
          grep -Fq 'timeout --signal=TERM --kill-after=5s 150s' "$file"
          grep -Fq 'tests/encounter-queue-purity.test.mjs' "$file"
          grep -Fq 'name: cz76-qa-candidate' "$file"
          grep -Fq -- '--draft --base main' "$file"
          if grep -Eq 'gh pr merge|path:.*kimi-(stdout|stderr)' "$file"; then
            echo '::error::Unsafe release or raw model artifact path'
            exit 1
          fi
          echo 'CZ-76 static QA role activation checked without model call.'

      - name: Check Kimi A issue 106 only and reduced-motion task boundaries
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/cz77-kimi-frontend-pilot.yml
          grep -Fq 'github.event.issue.number == 106' "$file"
          grep -Fq "github.actor == 'OWEF'" "$file"
          grep -Fq 'github.event.changes.title.from' "$file"
          grep -Fq -- '--agent-file .github/kimi/profiles/frontend-ux.md' "$file"
          grep -Fq "KIMI_LOOP_MAX_STEPS_PER_TURN: '8'" "$file"
          grep -Fq 'timeout --signal=TERM --kill-after=5s 150s' "$file"
          grep -Fq 'little-logo-presence.js|tests/lillogo-reduced-motion.test.mjs' "$file"
          grep -Fq 'name: cz77-frontend-candidate' "$file"
          grep -Fq -- '--draft --base main' "$file"
          if grep -Eq 'gh pr merge|path:.*kimi-(stdout|stderr)' "$file"; then
            echo "::error::Unsafe release or unredacted model logs"
            exit 1
          fi
          echo 'CZ-77 static frontend role gate passed without Kimi API usage.'

      - name: Validate Kimi D read-only diagnosis and sanitized comment gate
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/cz78-allowlisted-diagnosis.mjs
          node --test .github/scripts/cz78-allowlisted-diagnosis.test.mjs
          file=.github/workflows/cz78-kimi-debugging-pilot.yml
          grep -Fq 'github.event.issue.number == 109' "$file"
          grep -Fq "github.actor == 'OWEF'" "$file"
          grep -Fq 'github.event.changes.title.from' "$file"
          grep -Fq -- '--agent-file .github/kimi/profiles/debugging.md' "$file"
          grep -Fq "KIMI_LOOP_MAX_STEPS_PER_TURN: '6'" "$file"
          grep -Fq 'timeout --signal=TERM --kill-after=5s 120s' "$file"
          grep -Fq 'Read-only debugger changed repository files' "$file"
          grep -Fq 'name: cz78-diagnosis-codes' "$file"
          grep -Fq 'gh issue comment 109 --body-file' "$file"
          if grep -Eq 'gh pr create|gh pr merge|path:.*kimi-(stdout|stderr)' "$file"; then
            echo '::error::D diagnosis has GitHub PR actions or raw model artifact'
            exit 1
          fi
          echo 'CZ-78 enum-only, read-only model boundary verified without Kimi.'

      - name: Assert concurrency gates only eligible Kimi implementation jobs
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/cz69-kimi-cz17-pilot.yml \
            .github/workflows/cz76-kimi-qa-pilot.yml \
            .github/workflows/cz77-kimi-frontend-pilot.yml \
            .github/workflows/cz78-kimi-debugging-pilot.yml \
            .github/workflows/cz79-kimi-backend-pilot.yml; do
            if grep -q '^concurrency:' "$file"; then
              echo "::error::Top-level group cancels unrelated issue event workflows: $file"
              exit 1
            fi
            count="$(grep -c '^    concurrency:' "$file")"
            if [[ "$count" != "1" ]]; then
              echo "::error::Expected exactly one job-level concurrency block: $file"
              exit 1
            fi
            grep -A2 '^    concurrency:' "$file" | grep -Fq 'group: cz-69-kimi-coding'
            grep -A2 '^    concurrency:' "$file" | grep -Fq 'cancel-in-progress: false'
          done
          echo 'One serial group held by eligible jobs only; skipped issue workflows do not enter it.'

      - name: Validate one owner-bound Kimi B backend choice-length task
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/cz79-kimi-backend-pilot.yml
          grep -Fq 'github.event.issue.number == 112' "$file"
          grep -Fq "github.actor == 'OWEF'" "$file"
          grep -Fq 'github.event.changes.title.from' "$file"
          grep -Fq -- '--agent-file .github/kimi/profiles/backend-apis.md' "$file"
          grep -Fq "KIMI_LOOP_MAX_STEPS_PER_TURN: '8'" "$file"
          grep -Fq 'timeout --signal=TERM --kill-after=5s 150s' "$file"
          grep -Fq 'discover-ai-server.mjs|tests/discover-choice-length.test.mjs' "$file"
          grep -Fq 'name: cz79-backend-candidate' "$file"
          grep -Fq -- '--draft --base main' "$file"
          if grep -Eq 'gh pr merge|path:.*kimi-(stdout|stderr)' "$file"; then
            echo '::error::Unexpected auto-release or raw model output'
            exit 1
          fi
          echo 'Kimi B backend pilot boundaries verified without model usage.'
