name: CZ-128 B2.5 generalized consumer Encounter
on:
  push:
    branches: [feature/cz128-b25-generalized-encounter-v1]
  pull_request:
    paths:
      - "experiments/yl-b25-authored-scenarios.mjs"
      - "experiments/yl-b25-generic-bridge.mjs"
      - "experiments/yl-b25-encounter.mjs"
      - "experiments/yl-b25-encounter-server.mjs"
      - "experiments/yl-b25-encounter.html"
      - "experiments/yl-b25-encounter.js"
      - "experiments/yl-b25-encounter.css"
      - "tests/yl-b25-generalized-encounter.test.mjs"
      - "tests/yl-b25-browser.test.mjs"
      - ".github/workflows/cz128-b25-generalized.yml"
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Enforce exact B2.4 frozen baseline and B2.5 additive-only scope
        run: |
          set -euo pipefail
          BASE=5bb9b69d695b713b91cd947c1b7aba4fabe233a0
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD >/tmp/newfiles
          while IFS= read -r f; do
            case "$f" in
              experiments/yl-b25-*.mjs|experiments/yl-b25-*.html|experiments/yl-b25-*.css|experiments/yl-b25-*.js|tests/yl-b25-*.test.mjs|.github/workflows/cz128-b25-generalized.yml) ;;
              *) echo "Existing accepted frozen code changed: $f"; exit 1 ;;
            esac
          done </tmp/newfiles
      - name: Generalized source+meaning+expression held variants and negative proofs
        run: node --test tests/yl-b25-generalized-encounter.test.mjs
      - name: Install no-cost browser harness
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Consumer auto journey and manual QA six-peer browser
        run: node --test tests/yl-b25-browser.test.mjs
      - name: Browser screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz128-b25-consumer-qa-preview
          path: qa-evidence/
          if-no-files-found: warn
      - name: Inherited B2.4/B2.3+original engine/source regressions
        run: node --test tests/yl-b24-coherent-encounter.test.mjs tests/yl-b23-founder-six-peer.test.mjs tests/yl-milestone-a.test.mjs tests/yl-b1-editorial-gated.test.mjs
