# CZ-81 controlled continuation: bootstraps validated M2 art, then GitHub-native
# near-zero-gap job.needs through M3 -> M4 -> M5 -> DRAFT review PR.
# One initial attempt + at most ONE checkpoint-gated 600s retry per stage.
# No main branch edit, merge, production deployment or paid license.
name: CZ-81 LilLogo Controlled-Retry M3-M5 Chain
on:
  push:
    branches: [automation/cz81-conditional-retry-chain-20261105]
    paths: ['.github/workflows/cz81-conditional-retry-chain-once.yml']
permissions: {}
jobs:
  bootstrap:
    name: Verify known-good M2 candidate; zero Kimi usage
    if: >-
      github.repository == 'OWEF/Yourlogos' &&
      github.actor == 'OWEF' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/automation/cz81-conditional-retry-chain-20261105' &&
      github.event.before == '3244e89c40e4029c32856399c1bb4f42663809d3' &&
      github.event.head_commit.message == 'dispatch(cz81): exact pinned Actions SHA checkpoint chain' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout original approved PR #132 source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8176585ada4b1edf68e90c00e1b6c0fe92138105
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
      - name: Download M2 candidate from previously successful stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cz81-chain-m2-quarantine
          repository: OWEF/Yourlogos
          run-id: 41978866376
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/input
      - name: Verify exact art/test source integrity and re-run stage checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8176585ada4b1edf68e90c00e1b6c0fe92138105'
          test "$(find "$RUNNER_TEMP/input" -type f | wc -l)" = 3
          test -s "$RUNNER_TEMP/input/assets/lillogo-v3-layered-hybrid.svg"
          test -s "$RUNNER_TEMP/input/tests/cz81-eye-gaze.test.mjs"
          test -s "$RUNNER_TEMP/input/tests/cz81-head-neck.test.mjs"
          test "$(stat -c%s "$RUNNER_TEMP/input/assets/lillogo-v3-layered-hybrid.svg")" -le 180000
          cp "$RUNNER_TEMP/input/assets/lillogo-v3-layered-hybrid.svg" assets/
          cp "$RUNNER_TEMP/input/tests/cz81-eye-gaze.test.mjs" tests/
          cp "$RUNNER_TEMP/input/tests/cz81-head-neck.test.mjs" tests/
          node <<'NODE'
          const fs=require('fs');
          const xml=fs.readFileSync('assets/lillogo-v3-layered-hybrid.svg','utf8');
          const img=[...xml.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(img.length!==1 || !Buffer.from(img[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))throw Error('Original JPEG altered');
          if(/<script|<foreignObject/i.test(xml))throw Error('Unexpected active svg content');
          NODE
          git diff --check
          node --test tests/cz81-eye-gaze.test.mjs tests/cz81-head-neck.test.mjs tests/discover-encounter.test.mjs tests/discover-quote-schema.test.mjs
          mkdir -p "$RUNNER_TEMP/checkpoint/assets" "$RUNNER_TEMP/checkpoint/tests"
          cp assets/lillogo-v3-layered-hybrid.svg "$RUNNER_TEMP/checkpoint/assets/"
          cp tests/cz81-eye-gaze.test.mjs "$RUNNER_TEMP/checkpoint/tests/"
          cp tests/cz81-head-neck.test.mjs "$RUNNER_TEMP/checkpoint/tests/"
      - name: Upload verified baseline for immediate M3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m2-input
          path: ${{ runner.temp }}/checkpoint/
          if-no-files-found: error
          retention-days: 7


  m3:
    name: M3 Kimi A — one bounded stage, then immediate QA
    needs: [bootstrap]
    if: needs.bootstrap.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    concurrency:
      group: cz-69-kimi-coding
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout pinned approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8176585ada4b1edf68e90c00e1b6c0fe92138105
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
      - name: Download previous stage's verified quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cz81-retry-m2-input
          path: ${{ runner.temp }}/input
      - name: Overlay previous allowlisted code and preserve baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = '8176585ada4b1edf68e90c00e1b6c0fe92138105'
          mkdir -p "./assets"
          cp "$RUNNER_TEMP/input/assets/lillogo-v3-layered-hybrid.svg" "./assets/lillogo-v3-layered-hybrid.svg"
          mkdir -p "./tests"
          cp "$RUNNER_TEMP/input/tests/cz81-eye-gaze.test.mjs" "./tests/cz81-eye-gaze.test.mjs"
          mkdir -p "./tests"
          cp "$RUNNER_TEMP/input/tests/cz81-head-neck.test.mjs" "./tests/cz81-head-neck.test.mjs"
          mkdir -p "$RUNNER_TEMP/before"
          mkdir -p "$RUNNER_TEMP/before/assets"
          cp "./assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/before/assets/lillogo-v3-layered-hybrid.svg"
          mkdir -p "$RUNNER_TEMP/before/tests"
          cp "./tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs"
          mkdir -p "$RUNNER_TEMP/before/tests"
          cp "./tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs"
          node --check lillogo-rig-controller.js
          node --test tests/cz81-eye-gaze.test.mjs tests/cz81-head-neck.test.mjs
      - name: Install pinned Kimi CLI with no model key
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@moonshot-ai/kimi-code@2.4.1'
          kimi --version
          kimi --help | grep -q -- '--prompt'
          kimi --help | grep -q -- '--agent-file'
          test "$(node .github/scripts/cz69-role-router.mjs frontend-ux)" = '.github/kimi/profiles/frontend-ux.md'
      - name: Run Kimi A — first capped attempt, checkpointable one-retry policy
        id: model
        shell: bash
        timeout-minutes: 11
        env:
          KIMI_MODEL_NAME: kimi-for-coding
          KIMI_MODEL_PROVIDER_TYPE: kimi
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-m3
          KIMI_CODE_TRUST_WORKSPACE: 'true'
          KIMI_LOOP_MAX_STEPS_PER_TURN: '24'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '1'
          KIMI_CODE_INFINITE_RETRY: 'false'
          KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: exit
          KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: '1'
          KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: '45'
          CI: 'true'
        run: |
          set -euo pipefail
          test -n "$KIMI_MODEL_API_KEY"
          mkdir -p "$KIMI_CODE_HOME"
          prompt=$(cat <<'TASK'
          You are Kimi A, the original YourLogos character-animation specialist.
          M3A ONLY: independently articulate the ORIGINAL pale forelock,
          with one subtle delayed follow-through micro-movement when the
          existing head turns in idle/curious/reflective states.
          DO NOT animate a scarf, hands, arms or create a new mascot.
          This intentionally reduces the earlier M3 scope: that broad
          forelock + scarf task timed out at 600s in run 41978866376.
          Use the source-faithful existing 400x400 original-art hybrid
          assets/lillogo-v3-layered-hybrid.svg with current hairRig,
          headRig, eyeRig, eyelids and source portrait.
          Keep base64 embedded JPEG byte-identical. Keep eye/head behavior
          from M1/M2; no changes to skin, face or proportions.
          Add just one independent transform/origin and associated
          safe CSS for the forelock. Smooth ease and slight inertia,
          no constant large motion. Reduced motion stable, is-paused
          stops autonomous motion. No new images or external resources.
          Write a SMALL deterministic tests/cz81-accessory-motion.test.mjs
          verifying separate forelock motion and original asset integrity.
          ALLOWLIST ONLY existing SVG and this new test.
          No arbitrary brittle exact keyframe counting. If geometry
          cannot be adapted faithfully, mark the limitation and stop,
          don't fake the art.
          Do not touch any backend/UI/other files. No browser/web, Bash,
          subagent, paid tools, GitHub/production writes.
          One 600s attempt; the harness may give ONE additional 600s
          continuation only after validated source changes. Do not
          undertake the scarf/body tasks here.
          Strict file allowlist: assets/lillogo-v3-layered-hybrid.svg and tests/cz81-accessory-motion.test.mjs.
          TASK
          )
          set +e
          timeout --signal=TERM --kill-after=5s 600s kimi --agent-file .github/kimi/profiles/frontend-ux.md -p "$prompt" --output-format stream-json > "$RUNNER_TEMP/m3-stdout.jsonl" 2> "$RUNNER_TEMP/m3-stderr.log"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Model process finished with code $rc; no raw model logs published."

      - name: Evaluate progress after 600s timeout before allowing retry (m3)
        id: checkpoint
        if: steps.model.outputs.exit_code == '124'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | cut -c4-)"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              assets/lillogo-v3-layered-hybrid.svg) ;;
              tests/cz81-eye-gaze.test.mjs) ;;
              tests/cz81-head-neck.test.mjs) ;;
              tests/cz81-accessory-motion.test.mjs) ;;
              *) echo "::error::Unsafe change; do not retry: $f"; exit 1 ;;
            esac
          done <<< "$changed"
          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-head-neck.test.mjs"; exit 1; }
          # Timeouts merit one retry ONLY if at least one editable file actually changed.
          if ! cmp -s "$RUNNER_TEMP/before/assets/lillogo-v3-layered-hybrid.svg" "assets/lillogo-v3-layered-hybrid.svg" || test -s "tests/cz81-accessory-motion.test.mjs"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'No source-progress checkpoint; automatic retry refused.'
            exit 0
          fi
          node <<'NODE'
          const fs=require('fs');
          const svg=fs.readFileSync('assets/lillogo-v3-layered-hybrid.svg','utf8');
          const b64=[...svg.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(b64.length!==1 || !Buffer.from(b64[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))
            throw Error('Approved original JPEG is missing or changed');
          if(/<script|<foreignObject|(?:https?:\/\/)(?!www\.w3\.org)/i.test(svg))
            throw Error('Unexpected active or external resource in SVG');
          NODE
          mkdir -p "$RUNNER_TEMP/m3-checkpoint"
          mkdir -p "$RUNNER_TEMP/m3-checkpoint/assets"
          mkdir -p "$RUNNER_TEMP/m3-checkpoint/tests"
          if test -f "assets/lillogo-v3-layered-hybrid.svg"; then cp "assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/m3-checkpoint/assets/lillogo-v3-layered-hybrid.svg"; fi
          if test -f "tests/cz81-eye-gaze.test.mjs"; then cp "tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/m3-checkpoint/tests/cz81-eye-gaze.test.mjs"; fi
          if test -f "tests/cz81-head-neck.test.mjs"; then cp "tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/m3-checkpoint/tests/cz81-head-neck.test.mjs"; fi
          if test -f "tests/cz81-accessory-motion.test.mjs"; then cp "tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/m3-checkpoint/tests/cz81-accessory-motion.test.mjs"; fi
          echo 'Validated bounded checkpoint; one recovery attempt is now allowed.'

      - name: Upload m3 checkpoint BEFORE retry
        if: steps.checkpoint.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m3-progress
          path: ${{ runner.temp }}/m3-checkpoint/
          if-no-files-found: error
          retention-days: 7

      - name: Resume m3 from checked working-tree checkpoint ONCE (max another 600s)
        id: retry
        if: steps.model.outputs.exit_code == '124' && steps.checkpoint.outputs.ready == 'true'
        shell: bash
        timeout-minutes: 11
        env:
          KIMI_MODEL_NAME: kimi-for-coding
          KIMI_MODEL_PROVIDER_TYPE: kimi
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-m3
          KIMI_CODE_TRUST_WORKSPACE: 'true'
          KIMI_LOOP_MAX_STEPS_PER_TURN: '24'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '1'
          KIMI_CODE_INFINITE_RETRY: 'false'
          KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: exit
          KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: '1'
          KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: '45'
          CI: 'true'
        run: |
          set -euo pipefail
          test -n "$KIMI_MODEL_API_KEY"
          prompt=$(cat <<'TASK'
          You are continuing the previous capped M3 attempt ON THE SAME WORKSPACE FILES after a 600-second timeout.
          The previous job made verified source edits; DO NOT RESTART the art work.
          Complete only the partial implementation and its focused test.
          Keep original assets and all other stage tests unchanged.
          Exact allowed edits: assets/lillogo-v3-layered-hybrid.svg and tests/cz81-accessory-motion.test.mjs.
          Focus on completion rather than exploration or redesign.
          No Bash, subagents, network, GitHub writes or purchases.
          If safe functionality cannot be completed within this final
          600-second segment, say so rather than inventing a pass.
          TASK
          )
          set +e
          timeout --signal=TERM --kill-after=5s 600s kimi --agent-file .github/kimi/profiles/frontend-ux.md -p "$prompt" --output-format stream-json > "$RUNNER_TEMP/m3-retry-stdout.jsonl" 2> "$RUNNER_TEMP/m3-retry-stderr.log"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "One controlled retry finished with exit code $rc."

      - name: Preserve m3 retry remainder if second timebox also expires
        if: steps.retry.outputs.exit_code == '124'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | cut -c4-)"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              assets/lillogo-v3-layered-hybrid.svg) ;;
              tests/cz81-eye-gaze.test.mjs) ;;
              tests/cz81-head-neck.test.mjs) ;;
              tests/cz81-accessory-motion.test.mjs) ;;
              *) echo "::error::Unexpected retry change: $f"; exit 1 ;;
            esac
          done <<< "$changed"
          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-head-neck.test.mjs"; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const svg=fs.readFileSync('assets/lillogo-v3-layered-hybrid.svg','utf8');
          const b64=[...svg.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(b64.length!==1 || !Buffer.from(b64[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))
            throw Error('Approved original JPEG is missing or changed');
          if(/<script|<foreignObject|(?:https?:\/\/)(?!www\.w3\.org)/i.test(svg))
            throw Error('Unexpected active or external resource in SVG');
          NODE
          mkdir -p "$RUNNER_TEMP/m3-retry-remainder"
          mkdir -p "$RUNNER_TEMP/m3-retry-remainder/assets"
          mkdir -p "$RUNNER_TEMP/m3-retry-remainder/tests"
          if test -f "assets/lillogo-v3-layered-hybrid.svg"; then cp "assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/m3-retry-remainder/assets/lillogo-v3-layered-hybrid.svg"; fi
          if test -f "tests/cz81-eye-gaze.test.mjs"; then cp "tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/m3-retry-remainder/tests/cz81-eye-gaze.test.mjs"; fi
          if test -f "tests/cz81-head-neck.test.mjs"; then cp "tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/m3-retry-remainder/tests/cz81-head-neck.test.mjs"; fi
          if test -f "tests/cz81-accessory-motion.test.mjs"; then cp "tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/m3-retry-remainder/tests/cz81-accessory-motion.test.mjs"; fi

      - name: Upload second timeout remainder for human review
        if: steps.retry.outputs.exit_code == '124'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m3-second-timebox
          path: ${{ runner.temp }}/m3-retry-remainder/
          retention-days: 7
          if-no-files-found: error

      - name: Accept only successful original or exactly one successful retry
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          first="${{ steps.model.outputs.exit_code }}"
          second="${{ steps.retry.outputs.exit_code }}"
          if [[ "$first" == '0' ]] || [[ "$first" == '124' && "$second" == '0' ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "m3 model completed safely within at most two 600s timeboxes."
          else
            echo "::error::m3 failed (first=$first, retry=$second); stop all successors and notify."
            exit 1
          fi
      - name: Recheck immutable original artwork and exact stage boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/lillogo-v3-layered-hybrid.svg
          node <<'NODE'
          const fs=require('fs');
          const svg=fs.readFileSync('assets/lillogo-v3-layered-hybrid.svg','utf8');
          const b64=[...svg.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(b64.length!==1 || !Buffer.from(b64[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))
            throw Error('Approved original JPEG is missing or changed');
          if(/<script|<foreignObject|(?:https?:\/\/)(?!www\.w3\.org)/i.test(svg))
            throw Error('Unexpected active or external resource in SVG');
          NODE
          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-head-neck.test.mjs"; exit 1; }
          git diff --check

      - name: Quarantine allowlisted candidate BEFORE tests
        if: steps.finish.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | cut -c4-)"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              assets/lillogo-v3-layered-hybrid.svg) ;;
              tests/cz81-eye-gaze.test.mjs) ;;
              tests/cz81-head-neck.test.mjs) ;;
              tests/cz81-accessory-motion.test.mjs) ;;
              *) echo "::error::Unexpected changed path: $f"; exit 1 ;;
            esac
          done <<< "$changed"
          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior stage changed: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior stage changed: tests/cz81-head-neck.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/assets/lillogo-v3-layered-hybrid.svg" "assets/lillogo-v3-layered-hybrid.svg" && { echo "::error::Model did not update required source assets/lillogo-v3-layered-hybrid.svg"; exit 1; }
          test -s tests/cz81-accessory-motion.test.mjs
          mkdir -p "$RUNNER_TEMP/quarantine"
          mkdir -p "$RUNNER_TEMP/quarantine/assets"
          cp "./assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/quarantine/assets/lillogo-v3-layered-hybrid.svg"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-eye-gaze.test.mjs"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-head-neck.test.mjs"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-accessory-motion.test.mjs"
          echo "Candidate preserved; tests and visual review remain independent."
      - name: Upload quarantined m3 artifact even if QA fails
        if: steps.finish.outputs.success == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m3-quarantine
          path: ${{ runner.temp }}/quarantine/
          if-no-files-found: error
          retention-days: 7
      - name: Independently run m3 regression and safety gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check tests/cz81-accessory-motion.test.mjs
          node --check lillogo-rig-controller.js
          node --test tests/cz81-eye-gaze.test.mjs tests/cz81-head-neck.test.mjs tests/cz81-accessory-motion.test.mjs tests/discover-encounter.test.mjs tests/discover-quote-schema.test.mjs
          echo "m3 tests passed; next stage can begin immediately."


  m4:
    name: M4 Kimi A — one bounded stage, then immediate QA
    needs: [m3]
    if: needs.m3.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    concurrency:
      group: cz-69-kimi-coding
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout pinned approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8176585ada4b1edf68e90c00e1b6c0fe92138105
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
      - name: Download previous stage's verified quarantine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cz81-retry-m3-quarantine
          path: ${{ runner.temp }}/input
      - name: Overlay previous allowlisted code and preserve baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD)" = '8176585ada4b1edf68e90c00e1b6c0fe92138105'
          mkdir -p "./assets"
          cp "$RUNNER_TEMP/input/assets/lillogo-v3-layered-hybrid.svg" "./assets/lillogo-v3-layered-hybrid.svg"
          mkdir -p "./tests"
          cp "$RUNNER_TEMP/input/tests/cz81-eye-gaze.test.mjs" "./tests/cz81-eye-gaze.test.mjs"
          mkdir -p "./tests"
          cp "$RUNNER_TEMP/input/tests/cz81-head-neck.test.mjs" "./tests/cz81-head-neck.test.mjs"
          mkdir -p "./tests"
          cp "$RUNNER_TEMP/input/tests/cz81-accessory-motion.test.mjs" "./tests/cz81-accessory-motion.test.mjs"
          mkdir -p "$RUNNER_TEMP/before"
          mkdir -p "$RUNNER_TEMP/before/assets"
          cp "./assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/before/assets/lillogo-v3-layered-hybrid.svg"
          mkdir -p "$RUNNER_TEMP/before/tests"
          cp "./tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs"
          mkdir -p "$RUNNER_TEMP/before/tests"
          cp "./tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs"
          mkdir -p "$RUNNER_TEMP/before/tests"
          cp "./tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/before/tests/cz81-accessory-motion.test.mjs"
          node --check lillogo-rig-controller.js
          node --test tests/cz81-eye-gaze.test.mjs tests/cz81-head-neck.test.mjs tests/cz81-accessory-motion.test.mjs
      - name: Install pinned Kimi CLI with no model key
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@moonshot-ai/kimi-code@2.4.1'
          kimi --version
          kimi --help | grep -q -- '--prompt'
          kimi --help | grep -q -- '--agent-file'
          test "$(node .github/scripts/cz69-role-router.mjs frontend-ux)" = '.github/kimi/profiles/frontend-ux.md'
      - name: Run Kimi A — first capped attempt, checkpointable one-retry policy
        id: model
        shell: bash
        timeout-minutes: 11
        env:
          KIMI_MODEL_NAME: kimi-for-coding
          KIMI_MODEL_PROVIDER_TYPE: kimi
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-m4
          KIMI_CODE_TRUST_WORKSPACE: 'true'
          KIMI_LOOP_MAX_STEPS_PER_TURN: '24'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '1'
          KIMI_CODE_INFINITE_RETRY: 'false'
          KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: exit
          KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: '1'
          KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: '45'
          CI: 'true'
        run: |
          set -euo pipefail
          test -n "$KIMI_MODEL_API_KEY"
          mkdir -p "$KIMI_CODE_HOME"
          prompt=$(cat <<'TASK'
          You are Kimi A, YourLogos frontend state-machine specialist. Founder-approved CZ81 M4 only. Animation artwork M1-M3 is already provided as a validated local source; DO NOT edit art or tests from earlier stages. Refine existing preview-only, default-OFF lillogo-rig-controller.js to support natural semantic-state transitions (idle, curious, reflective, restful, quietly-delighted), stable lifecycle/mount/unmount, visibility and reduced-motion behavior, no duplicate listeners, and REAL saved-only finish semantics from existing CZ80 event bus. Edit only lillogo-rig-controller.js and create tests/cz81-motion-state-machine.test.mjs with deterministic mocked events and lifecycle assertions. No app.js, no backend, no authentication, no save logic mutation, no API, no new runtime libs, no production deploy. One run, no retries, 600 seconds max, 24 steps.
          Strict file allowlist: lillogo-rig-controller.js and tests/cz81-motion-state-machine.test.mjs. Do not alter any other file. No Bash, no model subagents, no GitHub writes or paid services. Keep original YourLogos LilLogo identity; this is a DRAFT art-review branch, no release authority.
          TASK
          )
          set +e
          timeout --signal=TERM --kill-after=5s 600s kimi --agent-file .github/kimi/profiles/frontend-ux.md -p "$prompt" --output-format stream-json > "$RUNNER_TEMP/m4-stdout.jsonl" 2> "$RUNNER_TEMP/m4-stderr.log"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Model process finished with code $rc; no raw model logs published."

      - name: Evaluate progress after 600s timeout before allowing retry (m4)
        id: checkpoint
        if: steps.model.outputs.exit_code == '124'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | cut -c4-)"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              assets/lillogo-v3-layered-hybrid.svg) ;;
              tests/cz81-eye-gaze.test.mjs) ;;
              tests/cz81-head-neck.test.mjs) ;;
              tests/cz81-accessory-motion.test.mjs) ;;
              lillogo-rig-controller.js) ;;
              tests/cz81-motion-state-machine.test.mjs) ;;
              *) echo "::error::Unsafe change; do not retry: $f"; exit 1 ;;
            esac
          done <<< "$changed"
          cmp -s "$RUNNER_TEMP/before/assets/lillogo-v3-layered-hybrid.svg" "assets/lillogo-v3-layered-hybrid.svg" || { echo "::error::Prior approved file modified: assets/lillogo-v3-layered-hybrid.svg"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-head-neck.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-accessory-motion.test.mjs" "tests/cz81-accessory-motion.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-accessory-motion.test.mjs"; exit 1; }
          # Timeouts merit one retry ONLY if at least one editable file actually changed.
          if test -s "lillogo-rig-controller.js" || test -s "tests/cz81-motion-state-machine.test.mjs"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'No source-progress checkpoint; automatic retry refused.'
            exit 0
          fi
          node <<'NODE'
          const fs=require('fs');
          const svg=fs.readFileSync('assets/lillogo-v3-layered-hybrid.svg','utf8');
          const b64=[...svg.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(b64.length!==1 || !Buffer.from(b64[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))
            throw Error('Approved original JPEG is missing or changed');
          if(/<script|<foreignObject|(?:https?:\/\/)(?!www\.w3\.org)/i.test(svg))
            throw Error('Unexpected active or external resource in SVG');
          NODE
          mkdir -p "$RUNNER_TEMP/m4-checkpoint"
          mkdir -p "$RUNNER_TEMP/m4-checkpoint/assets"
          mkdir -p "$RUNNER_TEMP/m4-checkpoint/tests"
          mkdir -p "$RUNNER_TEMP/m4-checkpoint/lillogo-rig-controller.j"
          if test -f "assets/lillogo-v3-layered-hybrid.svg"; then cp "assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/m4-checkpoint/assets/lillogo-v3-layered-hybrid.svg"; fi
          if test -f "tests/cz81-eye-gaze.test.mjs"; then cp "tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/m4-checkpoint/tests/cz81-eye-gaze.test.mjs"; fi
          if test -f "tests/cz81-head-neck.test.mjs"; then cp "tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/m4-checkpoint/tests/cz81-head-neck.test.mjs"; fi
          if test -f "tests/cz81-accessory-motion.test.mjs"; then cp "tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/m4-checkpoint/tests/cz81-accessory-motion.test.mjs"; fi
          if test -f "lillogo-rig-controller.js"; then cp "lillogo-rig-controller.js" "$RUNNER_TEMP/m4-checkpoint/lillogo-rig-controller.js"; fi
          if test -f "tests/cz81-motion-state-machine.test.mjs"; then cp "tests/cz81-motion-state-machine.test.mjs" "$RUNNER_TEMP/m4-checkpoint/tests/cz81-motion-state-machine.test.mjs"; fi
          echo 'Validated bounded checkpoint; one recovery attempt is now allowed.'

      - name: Upload m4 checkpoint BEFORE retry
        if: steps.checkpoint.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m4-progress
          path: ${{ runner.temp }}/m4-checkpoint/
          if-no-files-found: error
          retention-days: 7

      - name: Resume m4 from checked working-tree checkpoint ONCE (max another 600s)
        id: retry
        if: steps.model.outputs.exit_code == '124' && steps.checkpoint.outputs.ready == 'true'
        shell: bash
        timeout-minutes: 11
        env:
          KIMI_MODEL_NAME: kimi-for-coding
          KIMI_MODEL_PROVIDER_TYPE: kimi
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-m4
          KIMI_CODE_TRUST_WORKSPACE: 'true'
          KIMI_LOOP_MAX_STEPS_PER_TURN: '24'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '1'
          KIMI_CODE_INFINITE_RETRY: 'false'
          KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: exit
          KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: '1'
          KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: '45'
          CI: 'true'
        run: |
          set -euo pipefail
          test -n "$KIMI_MODEL_API_KEY"
          prompt=$(cat <<'TASK'
          You are continuing the previous capped M4 attempt ON THE SAME WORKSPACE FILES after a 600-second timeout.
          The previous job made verified source edits; DO NOT RESTART the art work.
          Complete only the partial implementation and its focused test.
          Keep original assets and all other stage tests unchanged.
          Exact allowed edits: lillogo-rig-controller.js and tests/cz81-motion-state-machine.test.mjs.
          Focus on completion rather than exploration or redesign.
          No Bash, subagents, network, GitHub writes or purchases.
          If safe functionality cannot be completed within this final
          600-second segment, say so rather than inventing a pass.
          TASK
          )
          set +e
          timeout --signal=TERM --kill-after=5s 600s kimi --agent-file .github/kimi/profiles/frontend-ux.md -p "$prompt" --output-format stream-json > "$RUNNER_TEMP/m4-retry-stdout.jsonl" 2> "$RUNNER_TEMP/m4-retry-stderr.log"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "One controlled retry finished with exit code $rc."

      - name: Preserve m4 retry remainder if second timebox also expires
        if: steps.retry.outputs.exit_code == '124'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | cut -c4-)"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              assets/lillogo-v3-layered-hybrid.svg) ;;
              tests/cz81-eye-gaze.test.mjs) ;;
              tests/cz81-head-neck.test.mjs) ;;
              tests/cz81-accessory-motion.test.mjs) ;;
              lillogo-rig-controller.js) ;;
              tests/cz81-motion-state-machine.test.mjs) ;;
              *) echo "::error::Unexpected retry change: $f"; exit 1 ;;
            esac
          done <<< "$changed"
          cmp -s "$RUNNER_TEMP/before/assets/lillogo-v3-layered-hybrid.svg" "assets/lillogo-v3-layered-hybrid.svg" || { echo "::error::Prior approved file modified: assets/lillogo-v3-layered-hybrid.svg"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-head-neck.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-accessory-motion.test.mjs" "tests/cz81-accessory-motion.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-accessory-motion.test.mjs"; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const svg=fs.readFileSync('assets/lillogo-v3-layered-hybrid.svg','utf8');
          const b64=[...svg.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(b64.length!==1 || !Buffer.from(b64[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))
            throw Error('Approved original JPEG is missing or changed');
          if(/<script|<foreignObject|(?:https?:\/\/)(?!www\.w3\.org)/i.test(svg))
            throw Error('Unexpected active or external resource in SVG');
          NODE
          mkdir -p "$RUNNER_TEMP/m4-retry-remainder"
          mkdir -p "$RUNNER_TEMP/m4-retry-remainder/assets"
          mkdir -p "$RUNNER_TEMP/m4-retry-remainder/tests"
          mkdir -p "$RUNNER_TEMP/m4-retry-remainder/lillogo-rig-controller.j"
          if test -f "assets/lillogo-v3-layered-hybrid.svg"; then cp "assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/m4-retry-remainder/assets/lillogo-v3-layered-hybrid.svg"; fi
          if test -f "tests/cz81-eye-gaze.test.mjs"; then cp "tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/m4-retry-remainder/tests/cz81-eye-gaze.test.mjs"; fi
          if test -f "tests/cz81-head-neck.test.mjs"; then cp "tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/m4-retry-remainder/tests/cz81-head-neck.test.mjs"; fi
          if test -f "tests/cz81-accessory-motion.test.mjs"; then cp "tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/m4-retry-remainder/tests/cz81-accessory-motion.test.mjs"; fi
          if test -f "lillogo-rig-controller.js"; then cp "lillogo-rig-controller.js" "$RUNNER_TEMP/m4-retry-remainder/lillogo-rig-controller.js"; fi
          if test -f "tests/cz81-motion-state-machine.test.mjs"; then cp "tests/cz81-motion-state-machine.test.mjs" "$RUNNER_TEMP/m4-retry-remainder/tests/cz81-motion-state-machine.test.mjs"; fi

      - name: Upload second timeout remainder for human review
        if: steps.retry.outputs.exit_code == '124'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m4-second-timebox
          path: ${{ runner.temp }}/m4-retry-remainder/
          retention-days: 7
          if-no-files-found: error

      - name: Accept only successful original or exactly one successful retry
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          first="${{ steps.model.outputs.exit_code }}"
          second="${{ steps.retry.outputs.exit_code }}"
          if [[ "$first" == '0' ]] || [[ "$first" == '124' && "$second" == '0' ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "m4 model completed safely within at most two 600s timeboxes."
          else
            echo "::error::m4 failed (first=$first, retry=$second); stop all successors and notify."
            exit 1
          fi
      - name: Recheck immutable original artwork and exact stage boundaries
        shell: bash
        run: |
