          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-head-neck.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-accessory-motion.test.mjs" "tests/cz81-accessory-motion.test.mjs" || { echo "::error::Prior approved file modified: tests/cz81-accessory-motion.test.mjs"; exit 1; }
          git diff --check

      - name: Quarantine allowlisted candidate BEFORE tests
        if: steps.finish.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | cut -c4-)"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              assets/lillogo-v3-layered-hybrid.svg) ;;
              tests/cz81-eye-gaze.test.mjs) ;;
              tests/cz81-head-neck.test.mjs) ;;
              tests/cz81-accessory-motion.test.mjs) ;;
              lillogo-rig-controller.js) ;;
              tests/cz81-motion-state-machine.test.mjs) ;;
              *) echo "::error::Unexpected changed path: $f"; exit 1 ;;
