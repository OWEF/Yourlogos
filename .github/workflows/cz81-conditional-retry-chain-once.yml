          cmp -s "$RUNNER_TEMP/before/tests/cz81-eye-gaze.test.mjs" "tests/cz81-eye-gaze.test.mjs" || { echo "::error::Prior stage changed: tests/cz81-eye-gaze.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-head-neck.test.mjs" "tests/cz81-head-neck.test.mjs" || { echo "::error::Prior stage changed: tests/cz81-head-neck.test.mjs"; exit 1; }
          cmp -s "$RUNNER_TEMP/before/tests/cz81-accessory-motion.test.mjs" "tests/cz81-accessory-motion.test.mjs" || { echo "::error::Prior stage changed: tests/cz81-accessory-motion.test.mjs"; exit 1; }
          true
          test -s tests/cz81-motion-state-machine.test.mjs
          mkdir -p "$RUNNER_TEMP/quarantine"
          mkdir -p "$RUNNER_TEMP/quarantine/assets"
          cp "./assets/lillogo-v3-layered-hybrid.svg" "$RUNNER_TEMP/quarantine/assets/lillogo-v3-layered-hybrid.svg"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-eye-gaze.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-eye-gaze.test.mjs"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-head-neck.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-head-neck.test.mjs"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-accessory-motion.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-accessory-motion.test.mjs"
          mkdir -p "$RUNNER_TEMP/quarantine/"
          cp "./lillogo-rig-controller.js" "$RUNNER_TEMP/quarantine/lillogo-rig-controller.js"
          mkdir -p "$RUNNER_TEMP/quarantine/tests"
          cp "./tests/cz81-motion-state-machine.test.mjs" "$RUNNER_TEMP/quarantine/tests/cz81-motion-state-machine.test.mjs"
          echo "Candidate preserved; tests and visual review remain independent."
      - name: Upload quarantined m4 artifact even if QA fails
        if: steps.finish.outputs.success == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cz81-retry-m4-quarantine
          path: ${{ runner.temp }}/quarantine/
          if-no-files-found: error
          retention-days: 7
      - name: Independently run m4 regression and safety gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check tests/cz81-motion-state-machine.test.mjs
          node --check lillogo-rig-controller.js
          node --test tests/cz81-eye-gaze.test.mjs tests/cz81-head-neck.test.mjs tests/cz81-accessory-motion.test.mjs tests/cz81-motion-state-machine.test.mjs tests/discover-encounter.test.mjs tests/discover-quote-schema.test.mjs
          echo "m4 tests passed; next stage can begin immediately."


