name: Encounter consequence review
on:
  pull_request:
    paths:
      - '**/*encounter-v1*'
      - 'philosophy-engine/encounter/consequence-v1.js'
      - 'scripts/build-scenario-transfer-lab-v02.mjs'
      - 'philosophy-engine/encounter/quotation-return-v12.js'
      - '**/*kernel*v11*'
      - '**/*semantic*v12*'
      - '**/*semantic*v18*'
      - '**/*semantic*v19*'
      - '**/*discover*v17*'
      - 'world-memory.js'
      - 'philosophy-engine/encounter/expression-engine-v1.js'
      - 'experiments/encounter-expression-qa.html'
      - 'philosophy-engine/encounter/encounter-distinction-v13.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 96152d406ed6c9eb3343787cf0487345660caed9
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/build-encounter-v1.mjs --check && node --test tests/scenario-transfer-v02.test.mjs tests/encounter-v1.test.mjs tests/kernel-v11.test.mjs tests/semantic-v12.test.mjs tests/semantic-v18-holdout.test.mjs tests/semantic-v19-transition.test.mjs tests/semantic-v19-transfer.test.mjs
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - run: node tests/encounter-v1-browser.mjs
      - run: node tests/kernel-v11-browser.mjs
      - run: node tests/semantic-v12-browser.mjs
      - run: test -s tests/discover-v17-browser.mjs && node tests/discover-v17-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-design-comparison
          path: design-review/*
