name: CZ-144 B2.6 independent exact-SHA four-family QA
on:
  push:
    branches: [qa/cz144-b26-final-exact-screens-v2]
  pull_request:
    paths:
      - "tests/cz144-b26-source-holdouts.test.mjs"
      - "tests/cz144-b26-browser-holdouts.test.mjs"
      - ".github/workflows/cz144-b26-independent.yml"
permissions:
  contents: read
jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Review ONLY exact frozen developer SHA and author QA files only
        run: |
          set -euo pipefail
          BASE=3cdceedb776c46acd45c3beb0079780e7d16a263
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > /tmp/qa_diff
          while IFS= read -r f; do
            case "$f" in
              tests/cz144-b26-source-holdouts.test.mjs|tests/cz144-b26-browser-holdouts.test.mjs|.github/workflows/cz144-b26-independent.yml) ;;
              *) echo "QA illegally modified an implementation file: $f"; exit 1 ;;
            esac
          done < /tmp/qa_diff
      - name: Independent novel content/relationship and canonical source negative holdouts
        run: node --test tests/cz144-b26-source-holdouts.test.mjs
      - name: Install free real Chromium harness
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Independent 4 full browser flows with different heldout choices
        run: node --test tests/cz144-b26-browser-holdouts.test.mjs
      - name: Archive 390px independent screenshots of all four
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cz144-b26-four-family-independent-screenshots
          path: qa-evidence/
          if-no-files-found: warn
      - name: Inherited actual six-family/engine/selection/source regression
        run: node --test tests/yl-b26-four-family-contract.test.mjs tests/yl-b26-four-family-functional.test.mjs tests/yl-b25-generalized-encounter.test.mjs tests/yl-b24-coherent-encounter.test.mjs tests/yl-b23-founder-six-peer.test.mjs tests/yl-milestone-a.test.mjs tests/yl-b1-editorial-gated.test.mjs
