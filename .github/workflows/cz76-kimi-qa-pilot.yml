# CZ-76: supervised role-specific Kimi C pilot; no production authority.
# Only trusted owner title transition on GitHub issue #103 may trigger this workflow.
name: CZ-76 Kimi C QA bounded pilot

on:
  issues:
    types: [edited]

permissions: {}

jobs:
  kimi-implementation:
    if: >-
      github.repository == 'OWEF/Yourlogos' &&
      github.actor == 'OWEF' &&
      github.event.issue.user.login == 'OWEF' &&
      github.event.issue.number == 103 &&
      github.event.issue.pull_request == null &&
      github.event.issue.title == '[RUN-CZ76-KIMI-C] Encounter queue immutability regression guard' &&
      github.event.changes.title.from == '[CZ76-QA-IDLE] Encounter queue immutability regression guard'
    runs-on: ubuntu-24.04
    concurrency:
      group: cz-69-kimi-coding
      cancel-in-progress: false
    timeout-minutes: 7
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.validate.outputs.changed }}
    steps:
      - name: Checkout trusted default branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: CZ75 manual quota and billing attestation (no model)
        shell: bash
        env:
          CZ75_MANUAL_QUOTA_READY: ${{ vars.CZ75_MANUAL_QUOTA_READY }}
        run: |
          set -euo pipefail
          if [[ "$CZ75_MANUAL_QUOTA_READY" != "true" ]]; then
            echo "::error::CZ75 HOLD: quota status and Extra Usage setting require operator review"
            echo "Check Kimi membership credit usage, current 5-hour capacity, and confirm Extra Usage is OFF."
            echo "Then set GitHub Actions repository variable CZ75_MANUAL_QUOTA_READY=true."
            exit 1
          fi
          echo 'Founder-managed quota and billing attestation present; this is NOT provider-verified telemetry.'
          node .github/scripts/cz75-readiness-gate.mjs .github/workflows/cz76-kimi-qa-pilot.yml

      - name: Install pinned Kimi CLI before exposing membership key
        run: |
          set -euo pipefail
          npm install --global '@moonshot-ai/kimi-code@2.4.1'
          kimi --version
          # This check is offline and requires no membership key or model call.
          # Prevent an unsupported CLI flag from consuming a coding attempt.
          kimi --help | grep -q -- '--prompt'
          kimi --help | grep -q -- '--output-format'
          kimi --help | grep -q -- '--agent-file'
          node .github/scripts/cz69-role-router.mjs --check
          test "$(node .github/scripts/cz69-role-router.mjs testing-qa)" = '.github/kimi/profiles/testing-qa.md'
          node --check .github/scripts/cz69-safe-report.mjs
          node --test .github/scripts/cz69-safe-report.test.mjs
          cp .github/scripts/cz69-safe-report.mjs "$RUNNER_TEMP/cz69-safe-report.mjs"

      - name: Run one bounded Kimi test-only pilot without GitHub write token
        id: model
        shell: bash
        timeout-minutes: 4
        env:
          KIMI_MODEL_NAME: kimi-for-coding
          KIMI_MODEL_PROVIDER_TYPE: kimi
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          KIMI_MODEL_BASE_URL: https://api.kimi.ai/coding/v1
          KIMI_CODE_HOME: ${{ runner.temp }}/cz69-kimi-home
          KIMI_CODE_TRUST_WORKSPACE: 'true'
          KIMI_LOOP_MAX_STEPS_PER_TURN: '8'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '1'
          KIMI_CODE_INFINITE_RETRY: 'false'
          KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: 'exit'
          KIMI_CODE_BACKGROUND_MAX_RUNNING_TASKS: '1'
          KIMI_CODE_BACKGROUND_BASH_TASK_TIMEOUT_S: '45'
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ -z "${KIMI_MODEL_API_KEY:-}" ]]; then
            echo "::error::Required KIMI_CODE_API_KEY secret is absent"
            exit 1
          fi
          mkdir -p "$KIMI_CODE_HOME"
          # Trusted, fixed task; issue title/body and PR content are NEVER injected.
          # The agent can use shell and network; this is a limited, owner-controlled
          # first pilot, not a general public-input or production-safe agent.
          prompt=$(cat <<'TASK'
          You are Kimi C, the YourLogos Testing & QA specialist.
          This is the ONE explicitly approved CZ-76 QA pilot, issue #103.
          Read AGENTS.md and encounter-queue.js. Create ONLY
          tests/encounter-queue-purity.test.mjs with 2–4 concise tests
          using node:test and node:assert/strict against real exports.
          Prove availableThoughts and followingThought accept frozen
          queue/saved arrays without mutation or exceptions, preserve the
          original array ordering, and produce deterministic results
          on repeated invocations; optionally test quoteAt purity.
          Tests should pass against CURRENT implementation without
          changes to encounter-queue.js or other production source.
          Do not modify any other file or add dependencies.
          Your QA profile does not have Bash; CI will run tests.
          Do not claim to have executed tests yourself.
          Do not use subagents, run commands, read environment variables
          or secrets, access network endpoints, deploy, or use GitHub.
          Keep the new test under 90 lines. End with concise handoff.
          TASK
          )
          # Phase 1 micro-pilot: 8 agent steps per turn, 1 failed-step attempt,
          # no automatic retries, 150-second hard process timeout.
          # These are execution caps, not verified token or dollar ceilings.
          start_seconds=$SECONDS
          set +e
          timeout --signal=TERM --kill-after=5s 150s \
            kimi --agent-file .github/kimi/profiles/testing-qa.md -p "$prompt" --output-format stream-json \
            > "$RUNNER_TEMP/kimi-stdout.jsonl" 2> "$RUNNER_TEMP/kimi-stderr.txt"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "elapsed_sec=$((SECONDS-start_seconds))" >> "$GITHUB_OUTPUT"
          echo "Kimi process stopped; raw model output intentionally withheld."
          # Never automatically retry after a failure or hard timeout.

      - name: Generate bounded sanitized diagnostics, even on timeout
        if: always()
        shell: bash
        env:
          MODEL_RC: ${{ steps.model.outputs.exit_code || 'missing' }}
          MODEL_SECONDS: ${{ steps.model.outputs.elapsed_sec || '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cz69-safe"
          if [[ -f "$RUNNER_TEMP/cz69-safe-report.mjs" ]]; then
            node "$RUNNER_TEMP/cz69-safe-report.mjs" \
              "$RUNNER_TEMP/kimi-stdout.jsonl" "$RUNNER_TEMP/kimi-stderr.txt" \
              "$MODEL_RC" "$MODEL_SECONDS" "$RUNNER_TEMP/cz69-safe/report.json"
          else
            printf '%s\n' '{"schema":"cz69-harness-diagnostics-v1","exitClass":"not_started","safeFieldsOnly":true,"usage":"not_verified"}' \
              > "$RUNNER_TEMP/cz69-safe/report.json"
          fi
          node -e '
            const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));
            if (r.safeFieldsOnly !== true) process.exit(1);
            console.log("CZ-69 sanitized outcome: "+r.exitClass);
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### CZ-69 sanitized model-run evidence\n" +
              "- Exit class: "+r.exitClass+"\n" +
              "- Duration: "+(r.elapsedSeconds ?? "not started")+" seconds\n" +
              "- Model usage: not verified\n" +
              "- No raw prompts, model replies, tools, paths or credentials published\n");
          ' "$RUNNER_TEMP/cz69-safe/report.json"

      - name: Upload safe timeout evidence (never raw agent logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cz69-safe-diagnostics
          path: ${{ runner.temp }}/cz69-safe/report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Fail closed when Kimi did not complete
        if: steps.model.outputs.exit_code != '0'
        run: |
          echo "::error::Kimi did not finish; no code validation or draft PR"
          exit 1

      - name: Validate scope and run tests with no Kimi credentials
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              tests/encounter-queue-purity.test.mjs) ;;
              *) echo "::error::Out-of-scope file changed: $file"; exit 1 ;;
            esac
          done < <(git status --porcelain | cut -c4-)
          git diff --check
          if [[ ! -f tests/encounter-queue-purity.test.mjs ]]; then
            echo "::error::Expected fresh regression test was not created"
            exit 1
          fi
          node --test tests/encounter-queue-purity.test.mjs tests/discover-encounter.test.mjs tests/discover-quote-schema.test.mjs
          node scripts/verify-v24.mjs
          mkdir -p "$RUNNER_TEMP/candidate/tests"
          cp tests/encounter-queue-purity.test.mjs "$RUNNER_TEMP/candidate/tests/"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo '### CZ-76 Kimi C candidate passed scoped validation' >> "$GITHUB_STEP_SUMMARY"
            echo '- Only the new deterministic Node regression test changed' >> "$GITHUB_STEP_SUMMARY"
            echo '- Regression and V2.4 tests passed, no production operation' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No changes after Kimi analysis; do not create a PR.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate for independent review (no credentials)
        if: steps.validate.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cz76-qa-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 3

  open-draft-pr:
    name: Stage scoped patch as an unmerged draft PR
    needs: kimi-implementation
    if: needs.kimi-implementation.result == 'success' && needs.kimi-implementation.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main, without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch only the candidate artifact from the preceding job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cz76-qa-candidate
          path: ${{ runner.temp }}/cz76-candidate/
      - name: Check artifact paths and create isolated draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/cz76-qa-pilot-${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f "$RUNNER_TEMP/cz76-candidate/tests/encounter-queue-purity.test.mjs"
          cp "$RUNNER_TEMP/cz76-candidate/tests/encounter-queue-purity.test.mjs" tests/
          git diff --check
          files="$(git status --porcelain | cut -c4-)"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              tests/encounter-queue-purity.test.mjs) ;;
              *) echo "::error::Unexpected candidate path: $file"; exit 1 ;;
            esac
          done <<< "$files"
          if [[ -z "$files" ]]; then
            echo "::error::Candidate patch contained no changes"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- tests/encounter-queue-purity.test.mjs
          git commit -m 'test(cz-76): Kimi C encounter queue immutability regression'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title 'test(cz-76): Kimi C encounter queue immutability guard' \
            --body 'Kimi C QA cloud candidate for [Linear CZ-76](https://linear.app/czd217/issue/CZ-76/phase-2-four-on-demand-kimi-specialist-profiles-and-explicit-role) and [GitHub #103](https://github.com/OWEF/Yourlogos/issues/103). Scoped change: one new queue immutability regression test only, using the explicitly selected QA agent profile. Tests passed in the separate no-GitHub-write-token Kimi job. Independent ChatGPT technical review required. **DO NOT MERGE OR DEPLOY**. Fresh PR CI status must be checked independently.'
          echo '### CZ-76 QA draft PR staged' >> "$GITHUB_STEP_SUMMARY"
          echo '- Await independent tech-lead code review and founder release approval' >> "$GITHUB_STEP_SUMMARY"
