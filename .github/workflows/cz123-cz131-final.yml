name: CZ-123 CZ-131 final independent exact-SHA acceptance
on:
  push:
    branches: [qa/cz123-cz131-final-acceptance-v2]
  pull_request:
    paths:
      - "tests/cz123-cz131-independent-holdout.test.mjs"
      - ".github/workflows/cz123-cz131-final.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-final:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify exact frozen engineering SHA and QA-only modifications
        run: |
          BASE=b18a3e6bcce8acbcf5bbd199d27d36cd390bb1da
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD | tee /tmp/final-diff.txt
          if grep -Ev '^(tests/cz123-cz131-independent-holdout\.test\.mjs|\.github/workflows/cz123-cz131-final\.yml)$' /tmp/final-diff.txt; then
            echo "FAIL: QA-only review has touched implementation"; exit 1
          fi
          test "$(git hash-object tests/cz123-independent-pr184-known.mjs)" = "2ef6ad3529f8fb02f3571b11c0304376c7c730d9"
          test "$(git hash-object tests/cz123-independent-pr184-adversarial.mjs)" = "3b0d8cd099ae0b73ca24a50fa9e714f6a130a965"
      - name: Independently reserved two new philosophical dilemmas plus genuine conceptual no-fit and fresh adversarial QA
        run: node --test tests/cz123-cz131-independent-holdout.test.mjs
      - name: CZ-131 full six-peer canonical and eight-path Emotion/Expression
        run: node --test tests/cz131-single-selection.test.mjs
      - name: CZ-123 unchanged baseline adversarial tests
        run: node --test tests/cz123-independent-pr184-known.mjs tests/cz123-independent-pr184-adversarial.mjs
      - name: CZ-130 accepted source and frozen engine compatibility
        run: |
          node --test tests/content-v212-editorial-regression.test.mjs tests/content-v21.test.mjs tests/content-v211-safe-controls.test.mjs tests/source-grounded-research-v211.test.mjs
          node --test tests/encounter-v20.test.mjs tests/semantic-v12.test.mjs tests/semantic-v19-admission.test.mjs
