name: Discover web regression
on:
  pull_request:
    paths:
      - "app.js"
      - "discover-ai-client.js"
      - "discover-ai-server.mjs"
      - "discover-quote-editorial.js"
      - "discover-quote-schema.js"
      - "discover-quote-drag.js"
      - "discover-quote-standard-substitutions.js"
      - "discover-concept-grammar.js"
      - "discover-living-v2.css"
      - "little-logo-presence.js"
      - "philosopher-portraits.js"
      - "philosopher-featured-art.js"
      - "philosopher-gallery.js"
      - "philosopher-gallery-v2.css"
      - "tests/**"
      - ".github/workflows/discover-web.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "discover-ai-client.js"
      - "discover-ai-server.mjs"
      - "discover-living-v2.css"
      - "little-logo-presence.js"
      - "philosopher-portraits.js"
      - "philosopher-featured-art.js"
      - "philosopher-gallery.js"
      - "philosopher-gallery-v2.css"
      - "tests/**"
      - ".github/workflows/discover-web.yml"
jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check liquid-navbar.js
          node --check liquid-slider.js
          node --check welcome.js
          node --check philosopher-featured-art.js
          node --check philosopher-portraits.js
          node --check philosopher-gallery.js
          node --check discover-ai-client.js
          node --check discover-quote-standard-substitutions.js
          node --check discover-quote-drag.js
          node --check discover-quote-schema.js
          node --check little-logo-presence.js
      - name: Run Waterline navigation regression
        run: node --test tests/liquid-navbar.test.mjs tests/liquid-slider.test.mjs
      - name: Run Discover regression
        run: node --test tests/discover-encounter.test.mjs tests/discover-quote-schema.test.mjs tests/discover-drag.test.mjs tests/philosopher-gallery.test.mjs
