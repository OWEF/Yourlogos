name: CZ81 iPhone visual review on free GitHub Pages
on:
  push:
    branches: [preview/cz81-iphone-acceptance-8176585]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cz81-iphone-pages-preview
  cancel-in-progress: true

jobs:
  pages:
    if: github.ref == 'refs/heads/preview/cz81-iphone-acceptance-8176585'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out isolated preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify original PR #132 code and art are pinned to reviewed SHA
        shell: bash
        env:
          APPROVED_SHA: 8176585ada4b1edf68e90c00e1b6c0fe92138105
        run: |
          set -euo pipefail
          git cat-file -e "$APPROVED_SHA^{commit}"
          for f in \
            encounter-events.js encounter-choreography.js \
            lillogo-rig-controller.js lillogo-rig-review.css \
            encounter-choreography.css assets/lillogo-v3-layered-hybrid.svg \
            assets/lillogo-v3-ai-matte.svg; do
            test "$(git rev-parse HEAD:"$f")" = "$(git rev-parse "$APPROVED_SHA":"$f")"
          done
          node --check encounter-events.js
          node --check encounter-choreography.js
          node --check lillogo-rig-controller.js
          echo "The original PR 132 code and artwork have identical blob SHAs."

      - name: Assemble strictly limited static review artifacts (no server, credentials or user data)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp preview/iphone/index.html _site/index.html
          cp encounter-events.js encounter-choreography.js lillogo-rig-controller.js _site/
          cp encounter-choreography.css lillogo-rig-review.css _site/
          cp assets/lillogo-v3-layered-hybrid.svg assets/lillogo-v3-ai-matte.svg _site/assets/
          touch _site/.nojekyll
          test -f _site/assets/lillogo-v3-ai-matte.svg
          test -f _site/index.html
          test "$(find _site -type f | wc -l)" -eq 9

      - name: Overlay approved scoped M5 draft onto static preview only
        shell: bash
        env:
          CANDIDATE_SHA: 5d2beba8ddbdabb68c549be67a2d90dba39b099c
          CANDIDATE_BRANCH: automation/cz81-m5-qa-reviewed-41988167190
        run: |
          set -euo pipefail
          # Do not modify the checked-out app/source; only the _site copy.
          git fetch --no-tags --depth=1 origin "refs/heads/$CANDIDATE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git show "$CANDIDATE_SHA:assets/lillogo-v3-layered-hybrid.svg" > _site/assets/lillogo-v3-layered-hybrid.svg
          git show "$CANDIDATE_SHA:lillogo-rig-controller.js" > _site/lillogo-rig-controller.js
          node --check _site/lillogo-rig-controller.js
          node <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('_site/assets/lillogo-v3-layered-hybrid.svg','utf8');
          const embedded=[...src.matchAll(/data:image\/jpeg;base64,([A-Za-z0-9+/=]+)/g)];
          if(embedded.length!==1)throw Error('Unexpected source raster count');
          if(!Buffer.from(embedded[0][1],'base64').equals(fs.readFileSync('little-logo-hd-v2.jpg')))throw Error('Approved portrait pixels changed');
          for(const id of ['headRig','eyeRig','eyelids','hairRig','neckUnderpaint'])if(!src.includes('id="'+id+'"'))throw Error('Missing expected art layer '+id);
          if(/<script|<foreignObject|(?:https?:\/\/)(?!www\.w3\.org)/i.test(src))throw Error('Unexpected external/active SVG reference');
          NODE
          echo 'Static Pages review contains validated PR 134 original-art animation and state controller; not production.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build isolated Happy-only face comparison using original approved portrait
        shell: bash
        env:
          HAPPY_SOURCE_SHA: 7bcb1eb047aa7ef4e96d92418f1a55b403af062c
          HAPPY_SOURCE_BRANCH: automation/cz81-e1-happy-art-review-42024798193
        run: |
          set -euo pipefail
          test "$(git hash-object little-logo-hd-v2.jpg)" = e3cdd89b145c4b10a9c4bae11ddd32ea5c24e111
          test -s preview/happy-review.html
          git fetch --no-tags --depth=1 origin "refs/heads/$HAPPY_SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$HAPPY_SOURCE_SHA"
          git show "$HAPPY_SOURCE_SHA:experiments/cz81-happy-expression-v1.svg" > "$RUNNER_TEMP/cz81-happy-source.svg"
          mkdir -p _site/experiments
          cp little-logo-hd-v2.jpg _site/little-logo-hd-v2.jpg
          cp preview/happy-review.html _site/happy-review.html
          python - <<'PY'
          import base64,re
          from pathlib import Path
          source=Path(__import__('os').environ['RUNNER_TEMP'])/'cz81-happy-source.svg'
          s=source.read_text()
          expected='href="../little-logo-hd-v2.jpg"'
          if s.count(expected)!=1:
              raise SystemExit('Happy candidate source image reference changed; stop preview.')
          forbidden=('<script','<foreignObject','@keyframes','<animate','onload=','onclick=')
          if any(x.lower() in s.lower() for x in forbidden):
              raise SystemExit('Unexpected executable/SVG animation content.')
          if re.search(r'(?:src|href)=["\x27]https?://',s):
              raise SystemExit('Unexpected remote asset.')
          data=base64.b64encode(Path('little-logo-hd-v2.jpg').read_bytes()).decode('ascii')
          s=s.replace(expected,'href="data:image/jpeg;base64,'+data+'"')
          if s.count('data:image/jpeg;base64,')!=1:
              raise SystemExit('Original artwork was not embedded exactly once.')
          Path('_site/experiments/cz81-happy-expression-v1.svg').write_text(s)
          PY
          test -s _site/happy-review.html
          test -s _site/experiments/cz81-happy-expression-v1.svg
          test "$(find _site -type f | wc -l)" -eq 12
          echo 'Happy-only mobile comparison assembled using approved JPEG and PR #136 candidate in static output only. Human aesthetic review is pending.' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure existing free GitHub Pages feature
        uses: actions/configure-pages@v5
      - name: Upload static review surface
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy review site (not Railway production)
        id: deploy
        uses: actions/deploy-pages@v4
