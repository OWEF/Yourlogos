<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101310">
<meta name="color-scheme" content="dark">
<title>YourLogos · Encounter</title>
<style>
:root{color-scheme:dark;--bg:#101310;--card:#1a211a;--card2:#283127;--line:#465044;--ink:#f4f0e5;--muted:#b7c0b1;--soft:#a0ac99;--sage:#a5bea2;--gold:#d7bd8b;--rose:#ceaba5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-width:280px;color:var(--ink);background:radial-gradient(ellipse 75% 320px at 22% 0%,#353526 0,transparent 95%),var(--bg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:22px 16px calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:23px Georgia,serif;letter-spacing:-.04em}
.version{font-size:10px;letter-spacing:.08em;color:var(--sage);border:1px solid #566654;padding:7px 10px;border-radius:99px}
.hero{max-width:790px;margin:31px 0 25px}
.eyebrow{font-size:10px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font:normal clamp(30px,5vw,48px)/1.12 Georgia,serif;letter-spacing:-.03em;margin:8px 0 13px}
.hero p{max-width:670px;color:var(--muted);margin:0;font-size:14px}
.tabs{display:flex;gap:9px;margin:22px 0 16px;flex-wrap:wrap}
.tab{flex:1;min-width:132px;background:#222c22;color:var(--ink);border:1px solid #4a5849;border-radius:13px;padding:13px 10px;text-align:left}
.tab strong{display:block;font-size:14px}.tab span{font-size:11px;color:var(--muted)}
.tab[aria-selected=true]{border-color:var(--gold);background:#3b382a}
.lab-intro{color:var(--muted);font-size:13px;margin-bottom:16px}
.parallel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:13px}
.parallel.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.case{background:var(--card);border:1px solid var(--line);border-radius:18px;min-width:0;overflow:hidden}
.case-top{padding:19px 17px;border-bottom:1px solid var(--line)}
.case-top .role{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.09em}
.case-top h2{font:normal 23px/1.14 Georgia,serif;margin:7px 0}
.case-top .quote{font:normal 19px/1.3 Georgia,serif;margin:11px 0;color:#ede6d6}
.case-top .work{font-size:11px;color:var(--sage)}
.case-top details{margin-top:10px}
details summary{font-size:12px;color:var(--gold);padding:7px 0;cursor:pointer}
details p{font-size:12px;color:var(--muted);margin:6px 0}
.case-body{padding:17px}
.case-body>.story{font-size:13px;color:#d6ddd0;line-height:1.55;margin:0 0 15px}
.question{font-weight:650;color:#f3ecdf;font-size:13px;margin:18px 0 10px}
.slider-block{margin:14px 0}
.slider-block .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.slider-block .hours{color:var(--gold);font-variant-numeric:tabular-nums}
input[type=range]{display:block;width:100%;accent-color:var(--gold);height:31px;touch-action:pan-x}
.time-stack{width:100%;height:16px;display:flex;overflow:hidden;border-radius:7px;background:#3b4637}
.time-stack span{transition:width .12s}
.time-legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.time-legend span{font-size:10px;color:var(--muted)}
.time-legend i{display:inline-block;width:7px;height:7px;border-radius:3px;margin-right:4px}
.choices{display:grid;gap:8px}
.choice{background:#2c3529;border:1px solid #52624e;border-radius:11px;color:var(--ink);padding:11px 12px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.choice[aria-pressed=true]{background:#41402d;border-color:var(--gold)}
.choice strong{display:block;font-size:12px}.choice small{display:block;font-size:11px;color:var(--muted)}
.choice .symbol{font-size:17px;color:var(--gold)}
.primary{display:block;width:100%;background:var(--gold);color:#28271f;border:0;border-radius:11px;padding:13px 12px;font-weight:750;margin:18px 0 5px}
.secondary{display:block;width:100%;border:1px solid #657b61;border-radius:11px;background:#283327;color:var(--sage);padding:11px 10px;font-size:12px}
.journey{background:radial-gradient(ellipse 80% 110px at 50% 0%,#333a2e,#202920);border:1px solid #4d5d4c;border-radius:14px;padding:16px 10px;margin-top:5px}
.journey-root{border:1px solid #bca87c;background:#36362c;color:var(--ink);border-radius:11px;padding:11px;text-align:center;display:block;max-width:86%;min-height:81px;margin:0 auto;font-size:12px}
.journey-root strong{display:block;font:normal 16px/1.27 Georgia,serif;margin:5px 0}
.journey-root span{font-size:10px;color:var(--muted)}
.fork{margin-top:9px}
.fork .prompt{font-size:11px;color:var(--gold);font-weight:700;text-align:center;margin:9px 0 0}
.fork svg{display:block;width:100%;height:39px;overflow:visible}
.fork path{stroke:#9eb19a;stroke-width:2;fill:none;vector-effect:non-scaling-stroke}
.fork circle{fill:var(--gold)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.branch{background:#29342b;color:var(--ink);min-width:0;border:1px solid #678166;border-radius:10px;padding:12px 6px;text-align:center;min-height:126px;display:flex;flex-direction:column;gap:6px}
.branch[aria-pressed=true]{border:2px solid var(--gold);background:#41402e}
.branch strong{font-size:12px;line-height:1.25}.branch small{font-size:10px;line-height:1.3;color:var(--muted)}
.branch .chosen{font-size:9px;color:var(--gold);margin-top:auto;text-transform:uppercase;letter-spacing:.08em}
.path-ready{border:1px dashed #c4af82;padding:12px;text-align:center;border-radius:12px;margin-top:16px;color:#eadbb9;font-size:13px}
.reset{border:0;background:transparent;color:var(--sage);text-decoration:underline;display:block;margin:10px auto 0;padding:10px;font-size:12px}
.result{border-top:1px solid var(--line);background:#252c23;padding:17px}
.result h3{font:normal 19px/1.2 Georgia,serif;margin:7px 0 12px}
.result .row{background:#30392d;border-left:2px solid var(--sage);border-radius:0 9px 9px 0;padding:8px 10px;margin:8px 0;font-size:12px}
.result .row strong{font-size:10px;color:var(--gold);display:block;text-transform:uppercase;letter-spacing:.07em}
.result p{font-size:12px;color:#d2dacd;margin:10px 0}
.result .guard{border-top:1px solid var(--line);padding-top:10px;color:var(--muted)}
.result pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111811;border:1px solid #404e3f;padding:9px;border-radius:9px;max-height:330px;overflow:auto;font-size:10px}
.control-note{padding:14px;border:1px dashed #98886b;border-radius:12px;background:#332e25;color:#dfd3ba;font-size:12px;margin-top:12px}
.matrix{background:#202920;border:1px solid #435141;border-radius:15px;padding:16px;margin-top:22px}
.matrix h2{font:normal 23px Georgia,serif;margin:0 0 11px}
.matrix-row{display:grid;grid-template-columns:110px 1fr;gap:9px;border-top:1px solid #3e4b3d;padding:10px 0;font-size:12px}
.matrix-row strong{color:var(--gold)}.matrix-row span{color:var(--muted)}
.foot{font-size:11px;color:var(--muted);margin-top:24px}
.foot a{color:var(--sage)}
.hidden{display:none!important}
@media(max-width:880px){.parallel.three{grid-template-columns:1fr 1fr}.parallel.three .case:last-child{grid-column:span 2}}
@media(max-width:680px){.parallel,.parallel.three{grid-template-columns:minmax(0,1fr)}.parallel.three .case:last-child{grid-column:auto}.case-top{padding:17px 16px}.case-body{padding:16px}.result{padding:16px}}
@media(max-width:360px){.branch{min-height:143px;padding:10px 5px}.branch strong{font-size:11px}.branch small{font-size:10px}.matrix-row{grid-template-columns:90px 1fr}}
main{max-width:660px}.result{scroll-margin:1rem}.result h3{font-size:clamp(23px,4vw,32px);line-height:1.22}.result p,.case-body>.story{font-size:15px}.choice strong,.branch strong{font-size:14px}.result details{margin-top:16px}.primary:disabled{opacity:.5;cursor:default}.tab[aria-pressed=true]{border-color:var(--gold);background:#3b382a}.result p.reflection{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
.result .section-label{display:block;color:var(--sage);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 4px}.result .section-label:first-child{margin-top:0}.result blockquote{font:italic 19px/1.28 Georgia,serif;color:var(--ink);margin:5px 0 8px;padding-left:10px;border-left:2px solid var(--gold)}.result p{margin:6px 0 10px;line-height:1.45}.result h3{font-size:24px;margin:4px 0 8px}.result .memory-reference{font-size:13px;color:var(--muted);border-left:2px solid var(--sage);padding-left:10px}.encounter-actions{display:flex;gap:10px;padding:15px 16px}.encounter-actions button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:12px 10px;border-radius:11px;font-size:14px}.encounter-actions [data-discover]{background:var(--gold);color:#28271f;font-weight:700}.encounter-actions [data-like][aria-pressed=true]{color:var(--rose);border-color:var(--rose)}
.distinction{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-block:1px solid var(--line);padding:9px 0;margin:8px 0}.distinction>div+div{padding-left:10px;border-left:1px solid var(--line)}.distinction dt{color:var(--sage);font-weight:650;font-size:12px}.distinction dd{margin:3px 0 0;font-size:14px;line-height:1.32}.distinction.sequence{border-top-color:var(--sage)}.result .world-note{line-height:1.35}
@media(max-width:360px){main{padding-inline:8px}.result{padding:12px}.result .section-label{margin-top:8px}.result p{margin:4px 0 6px}.result details{margin-top:6px}.distinction{margin:5px 0;padding:6px 0}.result h3{margin-bottom:4px}}

/* Discover: one immersive idea, one focused exercise, one composed reading. */
.lab-title{font:normal 17px Georgia,serif;margin:15px 0 5px;color:var(--muted)}
main[data-screen="intro"] .lab-title,main[data-screen="exercise"] .lab-title,main[data-screen="result"] .lab-title{display:none}
main[data-screen="intro"]{max-width:780px;min-height:100vh}
main[data-screen="intro"] .tabs{opacity:.75;max-width:400px;margin:16px auto 0}
main[data-screen="intro"] .tab{padding:7px 10px;min-width:130px}
main[data-screen="intro"] .tab span{display:none}
.flow-case{background:transparent;border:0;overflow:visible}
.entry-view{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:34px 12px;text-align:center}
.micro-label{color:var(--sage);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.entry-quote,.intro-quote{font:normal clamp(24px,5vw,31px)/1.38 Georgia,serif;color:var(--ink);max-width:640px;margin:0}
.entry-view .encounter-actions{width:min(340px,100%);padding:8px 0}
.flow-head{display:flex;align-items:center;justify-content:space-between;padding:7px 4px 12px;gap:12px}
.flow-back{border:0;background:transparent;color:var(--muted);padding:12px;min-height:44px;text-align:left;font-size:13px}
.flow-stage{font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--sage)}
.intro-view{min-height:min(72vh,650px);display:flex;align-items:center;justify-content:center;text-align:center}
.intro-content{display:flex;flex-direction:column;align-items:center;gap:28px;width:100%;max-width:620px;padding:40px 16px 56px}
.intro-quote{font-size:clamp(23px,4.8vw,29px)}
.intro-scenario{font:normal clamp(21px,4.5vw,27px)/1.52 Georgia,serif;color:var(--ink);margin:0;max-width:580px;animation:discover-reveal .65s ease-out .16s both}
.intro-cta{max-width:340px;margin:18px auto 0;animation:discover-reveal .6s ease-out .32s both}
@keyframes discover-reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.exercise-context{background:#202820;border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin:4px 0 10px}
.exercise-context p{font-size:14px;line-height:1.45;color:var(--muted);margin:6px 0 0}
.flow-exercise .case-body{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px}
.flow-exercise .case-body>.story,.flow-exercise .case-body>.eyebrow{display:none}
.flow-exercise .case-body>.lab-intro{margin:0 0 12px}
.flow-result .result{background:transparent;border:0;padding:0;margin:0;display:grid;gap:12px}
.reading-panel{padding:20px;border:1px solid var(--line);border-radius:17px;background:var(--card)}
.reading-panel .section-label{margin:0 0 8px!important;font-size:10px;letter-spacing:.11em}
.reading-panel p{font-size:14px;color:var(--muted);line-height:1.58;margin:12px 0 0}
.reading-self{border-color:#63755e;background:linear-gradient(140deg,#263025,#1a211b 70%)}
.reading-self h2{font:normal clamp(23px,4vw,29px)/1.25 Georgia,serif;margin:5px 0 10px}
.reading-self .distinction{margin:16px 0 0}
.reading-source blockquote{font:italic clamp(20px,4vw,25px)/1.35 Georgia,serif;border-left:2px solid var(--gold);padding:0 0 0 13px;margin:12px 0 16px}
.reading-question{border-color:#877b5a;background:linear-gradient(115deg,#302c22,#25271f)}
.reading-question .reflection{font:normal clamp(21px,4.5vw,26px)/1.4 Georgia,serif;color:var(--ink);margin:14px 0 8px}
.result .founder-qa{margin:10px 0 0}
@media(max-width:440px){.intro-content{padding:28px 12px 44px;gap:22px}.intro-view{min-height:65vh}.reading-panel{padding:18px}.tabs{margin-bottom:8px}.flow-exercise .case-body{padding:14px}}
@media(prefers-reduced-motion:reduce){.intro-scenario,.intro-cta{animation:none!important}}
</style></head><body><main><header><div class="brand">YourLogos.</div></header><h1 class="lab-title">Encounter</h1>
<nav class="tabs" aria-label="Choose an Encounter"><button class="tab" data-mode="dillard"><strong>Annie Dillard</strong><span>One evening to spend</span></button><button class="tab" data-mode="kierkegaard"><strong>Søren Kierkegaard</strong><span>A job in another city</span></button></nav>
<section id="cases" aria-label="Current Encounter"></section></main>
<script type="module">
import {getMechanismCase,optionsFor} from "../philosophy-engine/encounter/mechanism-transfer-cases-v02.js";
import {reallocateVariableBudget} from "../philosophy-engine/encounter/mechanism-transfer-engine-v02.js";
import {encounterConsequence,expressConsequence} from "../philosophy-engine/encounter/consequence-v1.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=id=>getMechanismCase(id);
const unit=n=>String(n)+"h";
const colors=["var(--gold)","var(--sage)","var(--rose)"];
const active={mode:"dillard", likes:{dillard:false,kierkegaard:false}, screen:{dillard:"entry",kierkegaard:"entry"}, cases:{
 dillard:{ticks:[2,2,2],motivation:null,result:null},
 kierkegaard:{stage:0,resource:null,barrier:null,action:null,result:null}
}};
function tradeoffHtml(id){
 const spec=slug(id),s=active.cases[id];
 const fields=spec.categories.map((name,i)=>'<div class="slider-block">'+
  '<div class="head"><label for="'+id+'-range-'+i+'">'+esc(name)+'</label>'+
  '<span class="hours" id="'+id+'-hour-'+i+'">'+unit(s.ticks[i]/2)+'</span></div>'+
  '<input type="range" id="'+id+'-range-'+i+'" min="0" max="6" step="1" value="'+s.ticks[i]+'"'+
  ' data-range="'+id+'" data-index="'+i+'" aria-label="'+esc(name)+' hours"'+
  ' aria-valuetext="'+unit(s.ticks[i]/2)+' out of 3 hours"></div>').join("");
 const bars='<div class="time-stack" aria-label="3-hour budget">'+s.ticks.map((v,i)=>
  '<span data-bar="'+id+'" data-index="'+i+'" style="width:'+(v/6*100)+'%;background:'+colors[i]+'"></span>').join("")+'</div>'+
 '<div class="time-legend">'+spec.categories.map((n,i)=>'<span><i style="background:'+colors[i]+'"></i>'+esc(n)+'</span>').join("")+'</div>';
 const opts='<div class="choices">'+spec.influences.map(o=>
  '<button type="button" class="choice" data-motive="'+id+'" data-value="'+o.id+'" aria-pressed="'+(s.motivation===o.id)+'">'+
  '<span class="symbol">✦</span><span><strong>'+esc(o.label)+'</strong><small>'+esc(o.detail)+'</small></span></button>').join("")+'</div>';
 return '<div class="case-body"><div class="eyebrow">YOUR SCENARIO</div><p class="story">'+esc(spec.scenario)+'</p>'+
  '<p class="question">How would you divide these three hours?</p>'+fields+bars+
  '<p class="question">What most influenced the choice?</p>'+opts+
  '<button class="primary" type="button" data-run="'+id+'" '+(s.motivation?'':'disabled')+'>Reveal the meaning</button></div>';
}
function forkHtml(id,key,options,source){
 const input=active.cases[id],picked=input[key];
 const sourceX=source===0?85:source===1?255:170;
 const spec=slug(id),prompt=spec.steps.find(x=>x.key===key).prompt;
 return '<div class="fork" data-fork="'+id+'-'+key+'"><div class="prompt">'+esc(prompt)+'</div>'+
  '<svg viewBox="0 0 340 41" preserveAspectRatio="none" aria-hidden="true"><path d="M'+sourceX+' 0 Q'+sourceX+' 15 170 16 M170 16 L85 40 M170 16 L255 40"/>'+
  '<circle cx="170" cy="16" r="3"/></svg>'+
  '<div class="pair" role="group" aria-label="'+esc(prompt)+'">'+
  options.map(option=>'<button type="button" class="branch" data-case="'+id+'" data-fork-choice="'+key+
   '" data-value="'+option.id+'" aria-pressed="'+(picked===option.id)+'">'+
   '<strong>'+esc(option.label)+'</strong><small>'+esc(option.detail)+'</small>'+
   (picked===option.id?'<span class="chosen">Selected path</span>':"")+
   '</button>').join("")+'</div></div>';
}
function decisionHtml(id){
 const spec=slug(id),s=active.cases[id];
 let h='<div class="case-body"><div class="eyebrow">YOUR SCENARIO</div><p class="story">'+esc(spec.scenario)+
  '</p><p class="lab-intro">Tap the starting point, then follow one choice at a time.</p>'+
  '<div class="journey" data-map="'+id+'"><button type="button" class="journey-root" data-start="'+id+'" aria-pressed="'+(s.stage>=1)+'">'+
  '<span>STARTING POINT</span><strong>'+esc(spec.startingPoint)+'</strong>'+
  '<span>'+(s.stage===0?"Tap to start":"Your route develops below")+'</span></button>';
 if(s.stage>=1)h+=forkHtml(id,"resource",optionsFor(spec,"resource",null),null);
 if(s.stage>=2){
  const i=optionsFor(spec,"resource",null).findIndex(o=>o.id===s.resource);
  h+=forkHtml(id,"barrier",optionsFor(spec,"barrier",s.resource),i);
 }
 if(s.stage>=3){
  const i=optionsFor(spec,"barrier",s.resource).findIndex(o=>o.id===s.barrier);
  h+=forkHtml(id,"action",optionsFor(spec,"action",s.barrier),i);
 }
 if(s.stage===4)h+='<div class="path-ready">Your route is complete. See what changed along the way.</div>';
 h+='</div>';
 if(s.stage>0)h+='<button type="button" class="reset" data-reset="'+id+'">Restart this journey</button>';
 if(s.stage===4)h+='<button type="button" class="primary" data-run="'+id+'">Reveal the meaning</button>';
 return h+'</div>';
}

function contrastHtml(visual){
 if(!visual)return "";
 return '<dl class="distinction '+esc(visual.form)+'" aria-label="The philosophical distinction">'+visual.items.map(item=>
   '<div><dt>'+esc(item.label)+'</dt><dd>'+esc(item.text)+'</dd></div>').join("")+'</dl>';
}
function render(){
 const id=active.mode, spec=slug(id), state=active.cases[id], screen=active.screen[id];
 const quote=id==="dillard"?spec.quote:"Life can only be understood backwards; but it must be lived forwards.";
 const view=screen==="result"?expressConsequence(state.result):null;
 const source='<span class="micro-label">'+esc(spec.author)+'</span>';
 const entry='<section class="entry-view" aria-label="Quotation">'+source+
   '<blockquote class="entry-quote">'+esc(quote)+'</blockquote>'+
   '<div class="encounter-actions" role="group" aria-label="Choose what to do with this quotation">'+
   '<button type="button" data-like="'+id+'" aria-pressed="'+active.likes[id]+'">'+(active.likes[id]?"♥ Liked":"♡ Like")+'</button>'+
   '<button type="button" data-discover="'+id+'">Discover</button></div></section>';
 const intro='<div class="flow-head"><button type="button" data-back="entry" class="flow-back" aria-label="Back to quotation">← Back</button></div>'+
   '<section class="intro-view" aria-label="Introducing the quotation and scenario">'+
   '<div class="intro-content">'+source+
   '<blockquote class="intro-quote">'+esc(quote)+'</blockquote>'+
   '<p class="intro-scenario">'+esc(spec.scenario)+'</p>'+
   '<button type="button" data-enter="'+id+'" class="primary intro-cta">'+
    (id==="dillard"?"Shape this evening":"Explore this decision")+'</button></div></section>';
 const exercise='<div class="flow-head"><button type="button" data-back="intro" class="flow-back" aria-label="Back to introduction">← Back</button>'+
   '<span class="flow-stage">YOUR CHOICES</span></div>'+
   '<div class="exercise-context"><span class="micro-label">'+esc(spec.author)+'</span><p>'+esc(spec.scenario)+'</p></div>'+
   (id==="dillard"?tradeoffHtml(id):decisionHtml(id));
 const result=view?'<div class="flow-head"><button type="button" data-back="exercise" class="flow-back" aria-label="Back to your choices">← Back to choices</button></div>'+
   '<section class="result journey-finale" tabindex="-1" aria-label="Your Encounter result">'+
   '<section class="reading-panel reading-self"><span class="section-label">Your Encounter with '+esc(spec.author)+'</span>'+
   '<h2>'+esc(view.headline)+'</h2><p>'+esc(view.experience)+'</p>'+
   (view.world?'<p class="memory-reference">'+esc(view.world.text)+'</p>':"")+
   contrastHtml(view.visual)+'</section>'+
   '<section class="reading-panel reading-source"><span class="section-label">Return to the philosopher</span>'+
   '<blockquote>'+esc(view.quote)+'</blockquote><p>'+esc(view.interpretation)+'</p></section>'+
   '<section class="reading-panel reading-question"><span class="section-label">A question to carry forward</span>'+
   '<p class="reflection">'+esc(view.proactiveQuestion)+'</p></section>'+
   (location.hash.startsWith("#qa")?'<details class="founder-qa"><summary>Founder QA · evidence and limits</summary><pre>'+esc(JSON.stringify(state.result,null,2))+'</pre></details>':"")+
   '</section>':"";
 const current=screen==="entry"?entry:screen==="intro"?intro:screen==="exercise"?exercise:result;
 $("cases").innerHTML='<article class="case flow-case flow-'+screen+'" data-id="'+id+'">'+current+'</article>';
 document.querySelectorAll("[data-mode]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.mode===id)));
 document.querySelector("main")?.setAttribute("data-screen",screen);
}
function refreshCard(){render();}
document.addEventListener("click",ev=>{
 const tab=ev.target.closest('[data-mode]');
 if(tab){active.mode=tab.dataset.mode;render();return;}
 const like=ev.target.closest("[data-like]");
 if(like){const id=like.dataset.like;active.likes[id]=!active.likes[id];render();document.querySelector("[data-like]")?.focus({preventScroll:true});return;}
 const discover=ev.target.closest("[data-discover]");
 if(discover){const id=discover.dataset.discover;active.screen[id]="intro";render();document.querySelector(".intro-view")?.focus({preventScroll:true});return;}
 const enter=ev.target.closest("[data-enter]");
 if(enter){active.screen[enter.dataset.enter]="exercise";render();document.querySelector(".case-body")?.focus({preventScroll:true});return;}
 const back=ev.target.closest("[data-back]");
 if(back){active.screen[active.mode]=back.dataset.back;render();document.querySelector("[data-back], [data-discover]")?.focus({preventScroll:true});return;}
 const motive=ev.target.closest("[data-motive]");
 if(motive){
  const s=active.cases[motive.dataset.motive];
  s.motivation=motive.dataset.value;s.result=null;refreshCard();document.querySelector('[data-motive][data-value="'+s.motivation+'"]').focus({preventScroll:true});return;
 }
 const start=ev.target.closest("[data-start]");
 if(start){
  const state=active.cases[start.dataset.start];
  if(state.stage!==0)return;
  state.stage=1;state.result=null;refreshCard();document.querySelector('[data-fork-choice="resource"]').focus();return;
 }
 const branch=ev.target.closest("[data-fork-choice]");
 if(branch){
  const id=branch.dataset.case,key=branch.dataset.forkChoice,value=branch.dataset.value;
  const state=active.cases[id],spec=slug(id);
  const index=["resource","barrier","action"].indexOf(key);
  const upstream=index===0?null:state[["resource","resource","barrier"][index]];
  if(!optionsFor(spec,key,upstream).some(choice=>choice.id===value))return;
  if(state[key]===value)return;
  if(key==="resource"){state.barrier=null;state.action=null;}
  if(key==="barrier"&&state.barrier!==value){state.action=null;}
  state[key]=value;state.stage=index+2;state.result=null;refreshCard(id);
  const next=["barrier","action"][index];
  document.querySelector(next?'[data-fork-choice="'+next+'"]':'[data-run]').focus();return;
 }
 const reset=ev.target.closest("[data-reset]");
 if(reset){
  active.cases[reset.dataset.reset]={stage:0,resource:null,barrier:null,action:null,result:null};
  refreshCard(reset.dataset.reset);return;
 }
 const run=ev.target.closest("[data-run]");
 if(run){
  const id=run.dataset.run,s=active.cases[id],spec=slug(id);

   // Standalone preview has no account context. An explicit fragment enables
   // a labeled synthetic example without reading storage or contacting a host.
   const memory=location.hash==="#qa-reflection"?{fixture:true,threads:[{
     id:"qa-example",type:"thread",quoteId:0,note:id==="dillard"?
       "How can I protect time for what matters?":"Can careful reasoning eliminate uncertainty before I act?"
   }]}:null;
   s.result=encounterConsequence(id,spec.family==="tradeoff"?{ticks:[...s.ticks],motivation:s.motivation}:
    {resource:s.resource,barrier:s.barrier,action:s.action},memory);

  active.screen[id]="result";refreshCard(id);const end=document.querySelector(".result");
  end?.focus({preventScroll:true});end?.scrollIntoView({block:"start",behavior:"instant"});return;
 }
});
document.addEventListener("input",ev=>{
 const range=ev.target.closest("[data-range]");
 if(!range)return;
 const id=range.dataset.range,index=Number(range.dataset.index),state=active.cases[id];
 state.ticks=reallocateVariableBudget(state.ticks,index,Number(range.value));state.result=null;
 state.ticks.forEach((tick,i)=>{
  const el=$(id+"-range-"+i);if(el){el.value=String(tick);el.setAttribute("aria-valuetext",unit(tick/2)+" out of 3 hours");}
  const value=$(id+"-hour-"+i);if(value)value.textContent=unit(tick/2);
  const bar=document.querySelector('[data-bar="'+id+'"][data-index="'+i+'"]');
  if(bar)bar.style.width=(tick/6*100)+"%";
 });
 const result=document.querySelector('[data-id="'+id+'"] .result');
 if(result)result.remove();
});
render();
</script></body></html>
