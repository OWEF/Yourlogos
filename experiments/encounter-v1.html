   '<p><strong>Your initial choice:</strong> '+firstSummary+'</p>'+
   '<p>'+(firstStillFits?'The earlier quantities remain feasible. You can keep or reconsider them.':
    'The earlier quantities no longer fit. Revise the allocation to meet the new constraint.')+'</p>'+
   '<p>'+consequence+'</p></div>'+
   '<button type="button" class="secondary" style="min-height:44px" data-reset-allocation>Change my first choice</button>':'';
  const status=effective.resources.map((r,i)=>esc(r.label)+" · "+spent[i]+" / "+state.budgets[i]+(r.type==="exact"?" required":" maximum")).join(" · ")+(first&&!facts?' · Revise to meet the changed condition.':'');
  return '<div class="case-body" tabindex="-1">'+controls+'<p aria-live="polite">'+status+'</p>'+reconsider+'<button class="primary" '+(semanticEdition&&!first?'data-test-allocation':'data-run="'+spec.id+'"')+' '+(facts?"":"disabled")+'>'+(semanticEdition&&!first?'See what changes':'Reveal the meaning')+'</button></div>';
 }
 let html='<div class="case-body" tabindex="-1">';
 for(let i=0;i<=state.path.length;i++){
  const stage=decisionStructure(m,state.path.slice(0,i));
  if(!stage||stage.at===null)break;
  html+='<fieldset class="route-step"><legend>'+esc(m.nodes[stage.at].prompt)+'</legend>'+stage.available.map(o=>
   '<button class="choice" data-k-step="'+i+'" data-value="'+esc(o.id)+'" aria-pressed="'+(state.path[i]===o.id)+'">'+esc(o.label)+'</button>').join("")+'</fieldset>';
 }
 if(decisionStructure(m,state.path)?.at===null)html+='<button class="primary" data-run="'+spec.id+'">Reveal the meaning</button>';
 return html+'</div>';
}
function tradeoffHtml(id){
 const spec=slug(id),s=active.cases[id];
 const fields=spec.categories.map((name,i)=>'<div class="slider-block">'+
  '<div class="head"><label for="'+id+'-range-'+i+'">'+esc(name)+'</label>'+
  '<span class="hours" id="'+id+'-hour-'+i+'">'+unit(s.ticks[i]/2)+'</span></div>'+
  '<input type="range" id="'+id+'-range-'+i+'" min="0" max="6" step="1" value="'+s.ticks[i]+'"'+
  ' data-range="'+id+'" data-index="'+i+'" aria-label="'+esc(name)+' hours"'+
  ' aria-valuetext="'+unit(s.ticks[i]/2)+' out of 3 hours"></div>').join("");
 const bars='<div class="time-stack" aria-label="3-hour budget">'+s.ticks.map((v,i)=>
  '<span data-bar="'+id+'" data-index="'+i+'" style="width:'+(v/6*100)+'%;background:'+colors[i]+'"></span>').join("")+'</div>'+
 '<div class="time-legend">'+spec.categories.map((n,i)=>'<span><i style="background:'+colors[i]+'"></i>'+esc(n)+'</span>').join("")+'</div>';
 const opts='<div class="choices">'+spec.influences.map(o=>
  '<button type="button" class="choice" data-motive="'+id+'" data-value="'+o.id+'" aria-pressed="'+(s.motivation===o.id)+'">'+
  '<span class="symbol">✦</span><span><strong>'+esc(o.label)+'</strong><small>'+esc(o.detail)+'</small></span></button>').join("")+'</div>';
 return '<div class="case-body" tabindex="-1"><div class="eyebrow">YOUR SCENARIO</div><p class="story">'+esc(spec.scenario)+'</p>'+
  '<p class="question">How would you divide these three hours?</p>'+fields+bars+
  '<p class="question">What most influenced the choice?</p>'+opts+
  '<button class="primary" type="button" data-run="'+id+'" '+(s.motivation?'':'disabled')+'>Reveal the meaning</button></div>';
}
function forkHtml(id,key,options,source){
 const input=active.cases[id],picked=input[key];
 const sourceX=source===0?85:source===1?255:170;
 const spec=slug(id),prompt=spec.steps.find(x=>x.key===key).prompt;
 return '<div class="fork" data-fork="'+id+'-'+key+'"><div class="prompt">'+esc(prompt)+'</div>'+
  '<svg viewBox="0 0 340 41" preserveAspectRatio="none" aria-hidden="true"><path d="M'+sourceX+' 0 Q'+sourceX+' 15 170 16 M170 16 L85 40 M170 16 L255 40"/>'+
  '<circle cx="170" cy="16" r="3"/></svg>'+
  '<div class="pair" role="group" aria-label="'+esc(prompt)+'">'+
  options.map(option=>'<button type="button" class="branch" data-case="'+id+'" data-fork-choice="'+key+
   '" data-value="'+option.id+'" aria-pressed="'+(picked===option.id)+'">'+
   '<strong>'+esc(option.label)+'</strong><small>'+esc(option.detail)+'</small>'+
   (picked===option.id?'<span class="chosen">Selected path</span>':"")+
   '</button>').join("")+'</div></div>';
}
function decisionHtml(id){
 const spec=slug(id),s=active.cases[id];
 let h='<div class="case-body" tabindex="-1"><div class="eyebrow">YOUR SCENARIO</div><p class="story">'+esc(spec.scenario)+
  '</p><p class="lab-intro">Tap the starting point, then follow one choice at a time.</p>'+
  '<div class="journey" data-map="'+id+'"><button type="button" class="journey-root" data-start="'+id+'" aria-pressed="'+(s.stage>=1)+'">'+
  '<span>STARTING POINT</span><strong>'+esc(spec.startingPoint)+'</strong>'+
  '<span>'+(s.stage===0?"Tap to start":"Your route develops below")+'</span></button>';
 if(s.stage>=1)h+=forkHtml(id,"resource",optionsFor(spec,"resource",null),null);
 if(s.stage>=2){
  const i=optionsFor(spec,"resource",null).findIndex(o=>o.id===s.resource);
  h+=forkHtml(id,"barrier",optionsFor(spec,"barrier",s.resource),i);
 }
 if(s.stage>=3){
  const i=optionsFor(spec,"barrier",s.resource).findIndex(o=>o.id===s.barrier);
  h+=forkHtml(id,"action",optionsFor(spec,"action",s.barrier),i);
 }
 if(s.stage===4)h+='<div class="path-ready">Your route is complete. See what changed along the way.</div>';
 h+='</div>';
 if(s.stage>0)h+='<button type="button" class="reset" data-reset="'+id+'">Restart this journey</button>';
 if(s.stage===4)h+='<button type="button" class="primary" data-run="'+id+'">Reveal the meaning</button>';
 return h+'</div>';
}

function contrastHtml(visual){
 if(!visual)return "";
 return '<dl class="distinction '+esc(visual.form)+'" aria-label="The philosophical distinction">'+visual.items.map(item=>
   '<div><dt>'+esc(item.label)+'</dt><dd>'+esc(item.text)+'</dd></div>').join("")+'</dl>';
}
const comparisonPreview=Boolean(document.querySelector('meta[name="expression-lab"]'));
function expressionComparison(packet){
 const meaning=selectExpressionMeaning(packet);
 const strategy=selectExpressionStrategy(meaning);
 return '<aside class="expression-lab" aria-label="Founder expression comparison"><h2>Compare voices</h2>'+
   '<p>Recommended for this path · '+esc(strategy.recommended)+'</p><div class="voice-grid">'+
   expressionModes.map(mode=>{
     const reading=composeExpression(meaning,mode);
     return '<article><small>'+esc(mode)+'</small><h3>'+esc(reading.headline)+'</h3><p>'+esc(reading.experience)+'</p>'+
       '<p>'+esc(reading.interpretation)+'</p><em>'+esc(reading.proactiveQuestion)+'</em></article>';
   }).join("")+'</div><details><summary>Validated meaning, sources and limits</summary><pre>'+
   esc(JSON.stringify(meaning,null,2))+'</pre></details></aside>';
}
function render(){
 const id=active.mode, spec=slug(id), state=active.cases[id], screen=active.screen[id];
 const quote=spec.quote||"Life can only be understood backwards; but it must be lived forwards.";
 if(document.querySelector("#more-passages"))document.querySelector("#more-passages").value=currentContexts[id]?id:"";
 let view=null;
 if(screen==="result"){
  if(state.result?.version==="meaning/1.2"){
   const meaning=selectExpressionMeaning(state.result),reading=meaning&&composeExpression(meaning);
   if(reading?.status==="ready")view={...reading,quote:spec.quote};
  }else view=expressConsequence(state.result);
 }
 const source='<span class="micro-label">'+esc(spec.author)+'</span>';
 const entry='<section class="entry-view" aria-label="Quotation"><img class="intro-logo" src="../little-logo-hd-v2.jpg" alt="">'+source+
   '<blockquote class="entry-quote">'+esc(quote)+'</blockquote>'+
   '<div class="encounter-actions" role="group" aria-label="Choose what to do with this quotation">'+
   '<button type="button" data-like="'+id+'" aria-pressed="'+active.likes[id]+'">'+(active.likes[id]?"♥ Liked":"♡ Like")+'</button>'+
   '<button type="button" data-discover="'+id+'">Discover</button></div></section>';
 const intro='<div class="flow-head"><button type="button" data-back="entry" class="flow-back" aria-label="Back to quotation">← Back</button></div>'+
   '<section class="intro-view" tabindex="-1" aria-label="Introducing the quotation and scenario">'+
   '<div class="intro-content"><img class="intro-logo" src="../little-logo-hd-v2.jpg" alt="">'+source+
   '<blockquote class="intro-quote">'+esc(quote)+'</blockquote>'+
   '<p class="intro-scenario">'+esc(spec.scenario)+'</p>'+
   '<button type="button" data-enter="'+id+'" class="primary intro-cta">'+
    (id==="dillard"?"Shape this evening":spec.mechanism==="tradeoff"?"Try the allocation":"Explore this decision")+'</button></div></section>';
 const exercise='<div class="flow-head"><button type="button" data-back="intro" class="flow-back" aria-label="Back to introduction">← Back</button>'+
   '<span class="flow-stage">YOUR CHOICES</span></div>'+
   '<div class="exercise-context"><span class="micro-label">'+esc(spec.author)+'</span><p>'+esc(spec.scenario)+'</p></div>'+
   (currentContexts[id]?kernelControls(spec,state):id==="dillard"?tradeoffHtml(id):decisionHtml(id));
 const result=view?'<div class="flow-head"><button type="button" data-back="exercise" class="flow-back" aria-label="Back to your choices">← Back to choices</button></div>'+
   '<section class="result journey-finale" tabindex="-1" aria-label="Your Encounter result">'+
   '<section class="reading-panel reading-self"><span class="section-label">Your Encounter with '+esc(spec.author)+'</span>'+
   '<h2>'+esc(view.headline)+'</h2><p>'+esc(view.experience)+'</p>'+
   (view.world?'<p class="memory-reference">'+esc(view.world.text)+'</p>':"")+
   contrastHtml(view.visual)+'</section>'+
   '<section class="reading-panel reading-source"><span class="section-label">Return to the philosopher</span>'+
   '<blockquote>'+esc(view.quote)+'</blockquote><p>'+esc(view.interpretation)+'</p></section>'+
   '<section class="reading-panel reading-question"><span class="section-label">A question to carry forward</span>'+
   '<p class="reflection">'+esc(view.proactiveQuestion)+'</p></section>'+
   (founderEdition?'<details class="founder-qa"><summary>Founder QA · evidence and limits</summary><pre>'+esc(JSON.stringify(state.result,null,2))+'</pre></details>':"")+
   '</section>'+(comparisonPreview?expressionComparison(state.result):""):"";
 const unavailable='<div class="flow-head"><button class="flow-back" data-back="exercise">Back to choices</button></div><p role="status">These choices do not yet support a responsible reading. Please revisit the scenario.</p>';
 const current=screen==="entry"?entry:screen==="intro"?intro:screen==="exercise"?exercise:(result||unavailable);
 $("cases").innerHTML='<article class="case flow-case flow-'+screen+'" data-id="'+id+'">'+current+'</article>';
 document.querySelectorAll("[data-mode]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.mode===id)));
 document.querySelector("main")?.setAttribute("data-screen",screen);
}
function refreshCard(){render();}
document.querySelector("#more-passages")?.addEventListener("change",ev=>{
 if(ev.target.value){active.mode=ev.target.value;render();}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){const back=document.querySelector("[data-back]");if(back){ev.preventDefault();back.click();}}});
document.addEventListener("click",ev=>{
 if(ev.target.closest('[data-test-allocation]')){
  const state=active.cases[active.mode],spec=currentContexts[active.mode];
  const developed=developedTradeoffModel(spec,spec.development?.id);
  if(!developed||!tradeoffStructure(spec.model,state))return;
  state.first={amounts:[...state.amounts],budgets:[...state.budgets]};
  state.developmentId=spec.development.id;
  state.budgets=state.budgets.map((n,i)=>Math.min(n,developed.resources[i].max));
  state.result=null;render();
  document.querySelector('[data-run]:not(:disabled), [data-k-slider="amounts"]')?.focus();return;
 }
 if(ev.target.closest('[data-reset-allocation]')){
  const state=active.cases[active.mode];
  if(!state.first)return;
  state.amounts=[...state.first.amounts];state.budgets=[...state.first.budgets];
  delete state.first;delete state.developmentId;state.result=null;
  render();document.querySelector('[data-test-allocation]')?.focus();return;
 }
 if(ev.target.closest('[data-confirm-allocation]')){active.cases[active.mode].confirmed=true;render();return;}
 const step=ev.target.closest("[data-k-step]");
 if(step){
  const state=active.cases[active.mode],i=Number(step.dataset.kStep);
  state.path=[...state.path.slice(0,i),step.dataset.value];state.result=null;render();
  document.querySelector('[data-k-step="'+(i+1)+'"], [data-run]')?.focus();return;
 }
 const tab=ev.target.closest('[data-mode]');
 if(tab){active.mode=tab.dataset.mode;render();return;}
 const like=ev.target.closest("[data-like]");
 if(like){const id=like.dataset.like;active.likes[id]=!active.likes[id];render();document.querySelector("[data-like]")?.focus({preventScroll:true});return;}
 const discover=ev.target.closest("[data-discover]");
 if(discover){const id=discover.dataset.discover;active.screen[id]="intro";render();document.querySelector(".intro-view")?.focus({preventScroll:true});return;}
 const enter=ev.target.closest("[data-enter]");
 if(enter){active.screen[enter.dataset.enter]="exercise";render();document.querySelector(".case-body")?.focus({preventScroll:true});return;}
 const back=ev.target.closest("[data-back]");
 if(back){active.screen[active.mode]=back.dataset.back;render();document.querySelector("[data-back], [data-discover]")?.focus({preventScroll:true});return;}
 const motive=ev.target.closest("[data-motive]");
 if(motive){
  const s=active.cases[motive.dataset.motive];
  s.motivation=motive.dataset.value;s.result=null;refreshCard();document.querySelector('[data-motive][data-value="'+s.motivation+'"]').focus({preventScroll:true});return;
 }
 const start=ev.target.closest("[data-start]");
 if(start){
  const state=active.cases[start.dataset.start];
  if(state.stage!==0)return;
  state.stage=1;state.result=null;refreshCard();document.querySelector('[data-fork-choice="resource"]').focus();return;
 }
 const branch=ev.target.closest("[data-fork-choice]");
 if(branch){
  const id=branch.dataset.case,key=branch.dataset.forkChoice,value=branch.dataset.value;
  const state=active.cases[id],spec=slug(id);
  const index=["resource","barrier","action"].indexOf(key);
  const upstream=index===0?null:state[["resource","resource","barrier"][index]];
  if(!optionsFor(spec,key,upstream).some(choice=>choice.id===value))return;
  if(state[key]===value)return;
  if(key==="resource"){state.barrier=null;state.action=null;}
  if(key==="barrier"&&state.barrier!==value){state.action=null;}
  state[key]=value;state.stage=index+2;state.result=null;refreshCard(id);
  const next=["barrier","action"][index];
  document.querySelector(next?'[data-fork-choice="'+next+'"]':'[data-run]').focus();return;
 }
 const reset=ev.target.closest("[data-reset]");
 if(reset){
  active.cases[reset.dataset.reset]={stage:0,resource:null,barrier:null,action:null,result:null};
  refreshCard(reset.dataset.reset);return;
 }
 const run=ev.target.closest("[data-run]");
 if(run){
  const id=run.dataset.run,s=active.cases[id],spec=slug(id);

   // Standalone preview has no account context. An explicit fragment enables
   // a labeled synthetic example without reading storage or contacting a host.
   const memory=location.hash==="#qa-reflection"?{fixture:true,threads:[{
     id:"qa-example",type:"thread",quoteId:0,note:id==="dillard"?
       "How can I protect time for what matters?":"Can careful reasoning eliminate uncertainty before I act?"
   }]}:null;
   s.result=currentContexts[id]?(semanticEdition?reasonSemantically(spec,s):evaluateKernel(spec,s)):encounterConsequence(id,spec.family==="tradeoff"?{ticks:[...s.ticks],motivation:s.motivation}:
    {resource:s.resource,barrier:s.barrier,action:s.action},memory);

  active.screen[id]="result";refreshCard(id);const end=document.querySelector(".result");
  end?.focus({preventScroll:true});end?.scrollIntoView({block:"start",behavior:"instant"});return;
 }
});
document.addEventListener("input",ev=>{
 const k=ev.target.closest("[data-k-slider]");
 if(k){
  const state=active.cases[active.mode],i=Number(k.dataset.i),kind=k.dataset.kSlider;
  state[kind][i]=Number(k.value);
  const m=currentContexts[active.mode].model;
  if(kind==="amounts"&&m.resources.length===1&&m.resources[0].type==="exact"&&m.choices.length===2&&m.choices.every(c=>c.cost[0]===1&&c.max>=state.budgets[0]))
   state.amounts[1-i]=state.budgets[0]-state.amounts[i];
  // Keep the active native range in place during touch dragging.
  const box=k.closest(".case-body");
  for(const el of box.querySelectorAll("[data-k-slider]")){
   el.value=state[el.dataset.kSlider][Number(el.dataset.i)];el.previousElementSibling.value=el.value;
  }
  const fresh=document.createElement("div");fresh.innerHTML=kernelControls(currentContexts[active.mode],state);
  box.querySelector("[aria-live]").textContent=fresh.querySelector("[aria-live]").textContent;
  const action=box.querySelector('[data-run], [data-test-allocation]');
  action.disabled=fresh.querySelector('[data-run], [data-test-allocation]').disabled;
  if(semanticEdition&&state.first){
   box.querySelector('.reconsider').innerHTML=fresh.querySelector('.reconsider').innerHTML;
   action.removeAttribute('data-test-allocation');action.setAttribute('data-run',active.mode);action.textContent='Reveal the meaning';
  }state.result=null;return;
 }
 const range=ev.target.closest("[data-range]");
 if(!range)return;
 const id=range.dataset.range,index=Number(range.dataset.index),state=active.cases[id];
 state.ticks=reallocateVariableBudget(state.ticks,index,Number(range.value));state.result=null;
 state.ticks.forEach((tick,i)=>{
  const el=$(id+"-range-"+i);if(el){el.value=String(tick);el.setAttribute("aria-valuetext",unit(tick/2)+" out of 3 hours");}
  const value=$(id+"-hour-"+i);if(value)value.textContent=unit(tick/2);
  const bar=document.querySelector('[data-bar="'+id+'"][data-index="'+i+'"]');
  if(bar)bar.style.width=(tick/6*100)+"%";
 });
 const result=document.querySelector('[data-id="'+id+'"] .result');
 if(result)result.remove();
});
if(semanticEdition){
 const nav=document.querySelector('.tabs');
 if(!founderEdition)nav.remove();
 else nav.innerHTML=Object.entries(currentContexts).map(([id,c])=>'<button data-mode="'+id+'">'+esc(c.author)+'</button>').join('');
 const requested=new URLSearchParams(location.hash.slice(1)).get('encounter');
 active.mode=Object.hasOwn(currentContexts,requested)?requested:'money';
}
render();
</script></body></html>
