/* EXACT RESEARCH MODULE: philosophy-engine/context-atlas/grammar-v01.js */
/**
 * CZ-110: Four-layer philosophical grammar and cautious mechanic assessment.
 * This module maps CURATED interpretations, not quote keywords, to tentative
 * interactions. It cannot prove an author's intended meaning or find truth.
 * No LLM, network, database, personal profiles, or runtime publication.
 */

const CONTEXT_ATLAS_SCHEMA_VERSION = 1;
const mechanics = Object.freeze({
  tradeoff: "source_grounded_constraint",
  decision_map: "branch_dependency",
  counterexample: "generalization_scope",
});
const nonEmpty = v => typeof v === "string" && v.trim().length > 0;
const object = v => v !== null && typeof v === "object" && !Array.isArray(v);
const quantities = ["universal","particular","singular","generic","unspecified"];
const qualities = ["affirmative","negative","mixed","figurative","not_classifiable"];
const relations = ["categorical","hypothetical","disjunctive","mixed","not_classifiable"];
const modalities = ["problematic","assertoric","apodictic","figurative","unspecified","not_classifiable"];
const requireText = (value, name, errors) => {if (!nonEmpty(value)) errors.push(name+" must be nonempty");};

function validateContextRecord(r) {
  const errors = [];
  if (!object(r)) return ["record must be an object"];
  if (!Number.isInteger(r.id)||r.id<0) errors.push("invalid quote id");
  requireText(r.quote?.text,"quote text",errors);
  requireText(r.quote?.author,"quote author",errors);
  requireText(r.quote?.bundledSource,"quote work",errors);
  if (!["catalogue_only","passage_location_checked","paraphrase_context_checked"].includes(r.quote?.provenanceStatus))
    errors.push("invalid quote provenance status");
  const p=r.sourcePassage;
  requireText(p?.work,"source passage work",errors);
  requireText(p?.contextualSummary,"passage context",errors);
  if (!Array.isArray(p?.references)||!p.references.some(x=>x.kind==="internal_bundled_catalogue"&&x.url==="app.js"))
    errors.push("must retain quote identity reference to bundled catalogue");
  for (const ref of p?.references||[]) {
    if (!nonEmpty(ref.url)||!nonEmpty(ref.supports)||!nonEmpty(ref.kind))
      errors.push("incomplete provenance reference");
    if (ref.url!=="app.js"&&!/^https:\/\//.test(ref.url))
      errors.push("external references must use https");
  }
  if (p?.contextStatus==="passage_linked_editorial_summary" &&
      !p.references.some(x=>x.url!=="app.js"))
    errors.push("passage linked without an external reference");
  requireText(r.authorPosition?.scopedSummary,"author position",errors);
  requireText(r.authorPosition?.periodOrWork,"position period/work",errors);
  if (!Array.isArray(r.authorPosition?.tradition)||!r.authorPosition.tradition.length||
    r.authorPosition.tradition.some(s=>!nonEmpty(s)))
    errors.push("tradition must be nonempty array");
  const a=r.argumentModel, f=a?.logicalForm;
  for (const key of ["claim","warrant","relation","scopeOrConditions","challenge","limits"]) requireText(a?.[key],"argument "+key,errors);
  if (!Array.isArray(a?.concepts)||a.concepts.length<2||new Set(a.concepts).size!==a.concepts.length)
    errors.push("concept list must contain at least two distinct nodes");
  if (!Array.isArray(a?.alternativeReadings)||a.alternativeReadings.length<2||a.alternativeReadings.some(x=>!nonEmpty(x)))
    errors.push("at least two plausible readings must be preserved");
  for (const [name,allowed] of [["quantity",quantities],["quality",qualities],["relation",relations],["modality",modalities]])
    if (!allowed.includes(f?.[name])) errors.push("unsupported logical form "+name);
  if(f?.interpretationNotLogicalProof!==true||!nonEmpty(f?.note))errors.push("logical classification must declare tentative reading");
  for (const key of ["name","task","target"]) requireText(r.philosophicalOperation?.[key],"operation "+key,errors);

  const i=r.interactionModel;
  if (!Object.keys(mechanics).concat("none").includes(i?.candidate))
    errors.push("unsupported candidate mechanic");
  if (i?.candidate==="none") {
    if(i.eligibility!=="none_suitable"||i.mechanismProof!==null||i.scenario!==null) errors.push("none-suitable must have no fabricated mechanic");
  } else {
    if(i?.eligibility!=="conditional"||i.mechanismProof?.kind!==mechanics[i.candidate]||
       !nonEmpty(i.mechanismProof?.ground)||!nonEmpty(i.mechanismProof?.requires)||
       !nonEmpty(i.scenario))
      errors.push("candidate lacks source-related operation proof");
  }
  requireText(i?.fitnessReason,"mechanic fitness",errors);
  requireText(i?.blocker,"mechanic blocker",errors);
  if (!Array.isArray(i?.contraindicatedScenarioIds)||
      i.contraindicatedScenarioIds.some(x=>!nonEmpty(x)))
    errors.push("invalid contraindicated scenario IDs");
  if (i?.approval!=="not_approved") errors.push("pilot cannot claim mechanic approval");
  if (r.review?.status!=="draft"||r.review?.scholarlyReviewed!==false||r.review?.publisherApproved!==false)
    errors.push("pilot may not be marked verified/published");
  return errors;
}

function evaluatePhilosophicalGrammar(r) {
  const errors=validateContextRecord(r);
  if(errors.length) throw new TypeError(errors.join("; "));
  const candidate=r.interactionModel.candidate;
  const hasExternalPassage = r.sourcePassage.references.some(x=>x.url!=="app.js");
  const eligibility = candidate==="none" ? "abstain_no_suitable_mechanic" :
    !hasExternalPassage ? "candidate_source_review_required" :
    "candidate_editorial_review_required";
  return {
    quoteId:r.id,
    version:CONTEXT_ATLAS_SCHEMA_VERSION,
    epistemicStatus:"editorial_hypothesis",
    sourceContext:{

 * CZ-111 Insight Packet v0.1: shared contract between source-grounded
 * philosophical reasoning and surface expression. It is not a truth verdict.
 */
const INSIGHT_PACKET_VERSION = 1;
const MAX_COPY = Object.freeze({headline:100,observation:190,discovery:230,connection:220,question:190});

function assertText(value, label, limit=2500) {
  if (typeof value !== "string" || !value.trim() || value.length > limit)
    throw new TypeError(label + " must be nonempty and <= " + limit + " characters");
}
function validateInsightPacket(packet) {
  const errors=[];
  try {
    if (packet?.schemaVersion !== INSIGHT_PACKET_VERSION) throw Error("schema version mismatch");
    if (![49,28].includes(packet.quote?.id)) throw Error("unknown pilot quote ID");
    if (!["tradeoff","decision_map"].includes(packet.mechanism)) throw Error("unknown mechanism");
    assertText(packet.scenarioId,"scenarioId");
    assertText(packet.quote?.text,"source quotation");
    assertText(packet.quote?.author,"author");
    assertText(packet.quote?.source,"work");
    assertText(packet.observation?.text,"observation",MAX_COPY.observation);
    assertText(packet.insight?.headline,"headline",MAX_COPY.headline);
    assertText(packet.insight?.discovery,"discovery",MAX_COPY.discovery);
    assertText(packet.insight?.connection,"connection",MAX_COPY.connection);
    assertText(packet.insight?.question,"question",MAX_COPY.question);
    assertText(packet.insight?.limit,"epistemic limit");
    assertText(packet.insight?.ruleId,"inference rule ID");
    assertText(packet.insight?.conceptualRelation,"source-grounded relation");
    if (!Array.isArray(packet.trace?.rules)||packet.trace.rules.length===0 ||
       packet.trace.rules.some(s=>typeof s!=="string"||!s.trim())) throw Error("missing fired rule trace");
    if (!Array.isArray(packet.trace?.sourceReferences)||!packet.trace.sourceReferences.length)
      throw Error("missing source trace");
    if (packet.flags?.truthVerdict!==false||packet.flags?.productionEligible!==false ||
       packet.flags?.editorialStatus!=="draft") throw Error("pilot must be clearly non-authoritative");
    if (packet.visual?.type==="segments") {
      const values=packet.visual.values;
      if(!Array.isArray(values)||values.length!==3||values.some(n=>!Number.isFinite(n)||n<0)||
         values.reduce((a,b)=>a+b,0)!==3)throw Error("invalid three-hour segment visual");
    } else if (packet.visual?.type==="path") {
      if(!Array.isArray(packet.visual.nodes)||packet.visual.nodes.length!==3)
        throw Error("invalid three-node path");
    } else throw Error("unsupported visual");
  } catch (e) {errors.push(e.message);}
  return errors;
}
function createInsightPacket(fields) {
  const packet={
    schemaVersion: INSIGHT_PACKET_VERSION,
    ...fields,
    flags:{truthVerdict:false,productionEligible:false,editorialStatus:"draft"}
  };
  const errors=validateInsightPacket(packet);
  if(errors.length)throw new TypeError(errors.join("; "));
  return packet;
}

    !Array.from(budgets).every((n,i)=>natural(n)&&n>=model.resources[i].min&&n<=model.resources[i].max)) return null;
 const spent=budgets.map((_,i)=>amounts.reduce((n,q,j)=>n+q*model.choices[j].cost[i],0));
 const slack=budgets.map((n,i)=>n-spent[i]);
 if(slack.some((n,i)=>n<0 || model.resources[i].type==="exact"&&n!==0))return null;
 const metric=model.metric;
 const components=metric?amounts.map((n,i)=>n*metric.weights[i]).filter((_,i)=>metric.weights[i]>0):[];
 return {spent,slack,measure:metric?(metric.op==="minimum"?Math.min(...components):components.reduce((a,b)=>a+b,0)):null};

function tradeoffStructure(model,input){
 const current=allocationFacts(model,input?.amounts,input?.budgets);
 if(!current)return null;
 const alternatives=[];
 // Compare one additional choice with either spare capacity or one unit
 // released elsewhere. Never treat an infeasible alternative as available.
 for(let add=0;add<model.choices.length;add++)for(let remove=-1;remove<model.choices.length;remove++){
  if(remove===add)continue;
  const next=input.amounts.slice();next[add]++;if(remove>=0)next[remove]--;
  const fact=allocationFacts(model,next,input.budgets);
  if(fact)alternatives.push({add,remove,amounts:next,measure:fact.measure,delta:fact.measure===null?null:fact.measure-current.measure});
 }
 return {...current,amounts:[...input.amounts],budgets:[...input.budgets],alternatives};
}

function decisionStructure(model,path){
 if(!Array.isArray(path))return null;

 const known=new Set(model.initial||[]),locked=new Set(),steps=[],visited=new Set();
 for(const id of path){
  if(at===null||!Object.hasOwn(model.nodes,at)||visited.has(at))return null;
  visited.add(at);
  const node=model.nodes[at];
  const available=node.options.filter(o=>(o.requires||[]).every(k=>known.has(k))&&!locked.has(o.id));
  const option=available.find(o=>o.id===id);
  if(!option)return null;
  steps.push({node:at,choice:id,label:option.label,before:[...known],revealed:option.reveal||[],
    alternatives:available.filter(o=>o!==option).map(o=>o.label),closed:option.closes||[]});
  for(const [field,value] of Object.entries(option.sets||{})){
   if(Object.hasOwn(commitments,field)&&commitments[field]!==value)revisions.push({field,from:commitments[field],to:value});
   commitments[field]=value;
  }
  for(const k of option.reveal||[])known.add(k);
  for(const k of option.closes||[])locked.add(k);
  at=option.next;
 }
 if(at!==null&&visited.has(at))return null;
 const available=at===null?[]:model.nodes[at].options.filter(o=>(o.requires||[]).every(k=>known.has(k))&&!locked.has(o.id));

  if(m.metric?.op==="minimum")headline=better&&better.remove>=0?"One more "+(m.choices[better.add].singular||"unit here")+" could change what the whole group finishes.":
    "What can be finished depends on the least supplied step.";
  else if(m.metric?.op==="sum")headline=structure.measure?"What you chose would cost "+measured(structure.measure)+".":"An unused budget leaves its underlying cost unclaimed.";
  else headline=structure.slack.every(n=>n===0)?"Another claim would need room from somewhere.":"There is still room before another choice has to give way.";

    last.revealed.length?"The consequence became visible after the choice.":"You could decide what to do while the claim itself stayed unsettled.";

   {classification:fit.assumptions.length?"conditional":"necessary",text:discovery,basis:"scenario model",assumptions:fit.assumptions},

  source:context.source,mechanism:context.mechanism,fit,structure,claims,distinction:context.distinction,
  headline,relation:context.relation,question,limitations:[context.limit],selections:allocation?{amounts:structure.amounts,budgets:structure.budgets}:{path:[...input.path]}};
}

// Translate the established pilots' existing configuration rather than copying
// their case-specific motive, historical, or quotation-return rules.
function pilotStructure(spec,result,input){
 const t=spec.family==="tradeoff";
 let model,selections;
 if(t){
  model={resources:[{id:"evening",min:6,max:6,type:"exact"}],choices:spec.categories.map((label,i)=>({id:i,label,max:6,cost:[1]}))};
  selections={amounts:input.ticks,budgets:[6]};
 }else{
  const nodes={};
  function expand(i,prior,name){
   const stage=spec.steps[i];
   const options=Array.isArray(stage.options)?stage.options:stage.options[prior];
   nodes[name]={prompt:stage.prompt,options:options.map(o=>{
    const next=i+1<spec.steps.length?name+"/"+o.id:null;
    if(next)expand(i+1,o.id,next);
    return {id:o.id,label:o.label,next,reveal:i===1?[o.label]:[]};
   })};
  }
  expand(0,null,"start");
  model={start:"start",nodes};selections={path:spec.steps.map(step=>input[step.key])};
 }
 const source=result.sourceReferences.find(s=>s.url?.startsWith("http"))||result.sourceReferences[0];
 return evaluateKernel({id:spec.id,quote:result.quote.text,author:spec.author,source:{...source,work:result.quote.work},
  model,operation:t?"scarcity":"path_dependence",operations:[spec.family],mechanism:spec.family,assumptions:["Within this imagined scenario."],relation:result.sourceRelation,
  distinction:result.sourceRelation,question:"Which condition makes this reading possible?",limit:spec.guard},selections);
}

// Fail closed at the expression boundary if claim status or its provenance
// has been lost while transporting a packet. Prose is emitted from claims.
function validateKernelPacket(packet){
 if(packet?.version!=="reasoning/1.1"||packet.status!=="ready"||!packet.source?.url||!packet.quote?.text||
   !Array.isArray(packet.claims)||!packet.claims.length||!packet.question)return false;
 if(!packet.claims.every(c=>c&&["necessary","conditional","unsupported"].includes(c.classification)&&c.basis&&
   typeof c.text==="string"&&c.text.length&&(c.classification!=="conditional"||Array.isArray(c.assumptions)&&c.assumptions.length>0)))return false;
 const backed=(role,text)=>packet.claims.some(c=>c.role===role&&c.classification!=="unsupported"&&c.text===text);
 return backed("discovery",packet.headline)&&backed("interpretation",packet.relation)&&
   packet.claims.some(c=>c.basis==="validated selections"&&c.classification==="necessary");
}

// The authored phrase is evidence of a question, not agreement with its thesis.
// These are conservative, source-specific semantic gates: no remote embeddings,
// no model-generated memories, and no matching on themes/saves alone.
function relatedVolunteeredReflection(id, value, inquiry){
  const words=typeof value==="string"?value.trim():"";
  if(words.length<22 || words.length>240) return false;
  if(/^(?:my friend|a friend|someone|he|she|they|the article|the quote|the app|the philosopher|i read|imagine|suppose|for example)\b/i.test(words)) return false;
  if(/^i (?:do not|don't|never) (?:wonder|worry|ask|question)\b/i.test(words)) return false;
  if(!/^(?:i\b|i'm\b|i've\b|it feels like i\b|my\b|we\b|our\b|how\b|when\b|what\b|why\b|can\b|could\b|should\b|does\b|is\b)/i.test(words)) return false;
  if(inquiry.pattern.test(words) || inquiry.statement.test(words)) return true;
  if(id==="dillard"){
    const aboutMeaningfulPractice=/\b(?:writ(?:e|ing)|story|time for what matters|daily habits|routines?|priorit(?:y|ies)|things i care about)\b/i.test(words);
    const aboutRepeatedTime=/\b(?:time|hours?|days?|week|schedule|routine|messages?|repl(?:y|ies)|postpon(?:e|ing)|interrupt(?:ion|ed|ions?)|distract(?:ion|ed|ions?)|demands?)\b/i.test(words);
    return aboutMeaningfulPractice && aboutRepeatedTime;
  }
  if(id==="kierkegaard"){
    const aboutChoice=/\b(?:decid(?:e|es|ed|ing)|decisions?|choos(?:e|ing)|choices?|act(?:ing)?|commit(?:ting|ment)?|keep going|moving|stay(?:ing)?)\b/i.test(words);
    const aboutKnowledgeInTime=/\b(?:uncertain(?:ty)?|unknown|unsure|not know|don't know|cannot know|predict(?:ion)?|future|before|after|later|regret(?:ting)?|outcome|hindsight|certainty|know what|what will happen)\b/i.test(words);
    return aboutChoice && aboutKnowledgeInTime;
  }
  return false;
}

function encounterWorldThread(memory,id){
  const inquiry=priorInquiries[id];
  if (!inquiry || !Array.isArray(memory?.threads)) return null;
  for(const record of [...memory.threads].reverse()){
    if(record?.type!=="thread" || !record.id || !Number.isInteger(record.quoteId)) continue;
    for(const field of ["note","opening"]){
      const words=record[field];
      if(!relatedVolunteeredReflection(id,words,inquiry)) continue;
      const fixture=memory.fixture===true;
      return {source:"livingThreads.history",recordId:record.id,field,quoteId:record.quoteId,date:record.date||null,
        fixture,excerpt:words.trim(),interpretation:inquiry.connection,
        text:(fixture?"In this sample reflection":"You previously wrote")+": “"+words.trim().slice(0,110)+(words.trim().length>110?"…":"")+"” "+inquiry.connection};
    }
  }
  return null;
}

}

function kernelControls(spec,state){
 const m=spec.model;
 if(spec.mechanism==="tradeoff"){
  const slider=(kind,index,label,max,min,value)=>`<label class="allocation-line"><span>${esc(label)}</span><output>${value}</output>
  <input aria-label="${esc(label)}" data-k-slider="${kind}" data-i="${index}" type="range" min="${min}" max="${max}" value="${value}"></label>`;
  const afterModel=semanticEdition&&state.first?developedTradeoffModel(spec,state.developmentId):null;
  const effective=afterModel||m;
  const spent=effective.resources.map((r,i)=>m.choices.reduce((n,c,j)=>n+c.cost[i]*state.amounts[j],0));
  const controls=effective.resources.map((r,i)=>r.min===r.max?"":slider("budgets",i,r.label,r.max,r.min,state.budgets[i])).join("")+
   m.choices.map((c,i)=>slider("amounts",i,c.label,c.max,0,state.amounts[i])).join("");
  const facts=tradeoffStructure(effective,state);
  const first=state.first;
  const firstStillFits=first&&Boolean(tradeoffStructure(effective,{amounts:first.amounts,budgets:state.budgets}));
  const consequence=semanticEdition&&facts&&m.metric?'The revised arrangement corresponds to '+facts.measure+' '+esc(m.metric.unit)+'.':'';
  const firstSummary=first?m.choices.map((c,i)=>first.amounts[i]+' '+esc(c.label)).join(' · '):'';
  const reconsider=semanticEdition&&first?'<div class="reconsider" role="group" aria-label="The changed condition">'+
   '<p><strong>A new condition in this imagined scenario:</strong> '+esc(spec.development.label)+'</p>'+
   '<p><strong>Your initial choice:</strong> '+firstSummary+'</p>'+
   '<p>'+(firstStillFits?'The earlier quantities remain feasible. You can keep or reconsider them.':
    'The earlier quantities no longer fit. Revise the allocation to meet the new constraint.')+'</p>'+
   '<p>'+consequence+'</p></div>'+
   '<button type="button" class="secondary" style="min-height:44px" data-reset-allocation>Change my first choice</button>':'';
  const status=effective.resources.map((r,i)=>esc(r.label)+" · "+spent[i]+" / "+state.budgets[i]+(r.type==="exact"?" required":" maximum")).join(" · ")+(first&&!facts?' · Revise to meet the changed condition.':'');
  return '<div class="case-body" tabindex="-1">'+controls+'<p aria-live="polite">'+status+'</p>'+reconsider+'<button class="primary" '+(semanticEdition&&spec.development&&!first?'data-test-allocation':'data-run="'+spec.id+'"')+' '+(facts?"":"disabled")+'>'+(semanticEdition&&spec.development&&!first?'See what changes':'Reveal the meaning')+'</button></div>';
 }
 let html='<div class="case-body" tabindex="-1">';
 for(let i=0;i<=state.path.length;i++){
  const stage=decisionStructure(m,state.path.slice(0,i));
  if(!stage||stage.at===null)break;
  html+='<fieldset class="route-step"><legend>'+esc(m.nodes[stage.at].prompt)+'</legend>'+stage.available.map(o=>
   '<button class="choice" data-k-step="'+i+'" data-value="'+esc(o.id)+'" aria-pressed="'+(state.path[i]===o.id)+'">'+esc(o.label)+'</button>').join("")+'</fieldset>';
 }
 if(decisionStructure(m,state.path)?.at===null)html+='<button class="primary" data-run="'+spec.id+'">Reveal the meaning</button>';
 return html+'</div>';
}

  const state=active.cases[id],spec=slug(id);
  const index=["resource","barrier","action"].indexOf(key);
  const upstream=index===0?null:state[["resource","resource","barrier"][index]];
  if(!optionsFor(spec,key,upstream).some(choice=>choice.id===value))return;
  if(state[key]===value)return;
  if(key==="resource"){state.barrier=null;state.action=null;}
  if(key==="barrier"&&state.barrier!==value){state.action=null;}
  state[key]=value;state.stage=index+2;state.result=null;refreshCard(id);
  const next=["barrier","action"][index];
  document.querySelector(next?'[data-fork-choice="'+next+'"]':'[data-run]').focus();return;
 }
 const reset=ev.target.closest("[data-reset]");
 if(reset){
  active.cases[reset.dataset.reset]={stage:0,resource:null,barrier:null,action:null,result:null};
  refreshCard(reset.dataset.reset);return;
 }
 const run=ev.target.closest("[data-run]");
 if(run){
  const id=run.dataset.run,s=active.cases[id],spec=slug(id);

   // Standalone preview has no account context. An explicit fragment enables
   // a labeled synthetic example without reading storage or contacting a host.
   const memory=location.hash==="#qa-reflection"?{fixture:true,threads:[{
     id:"qa-example",type:"thread",quoteId:0,note:id==="dillard"?
       "How can I protect time for what matters?":"Can careful reasoning eliminate uncertainty before I act?"
   }]}:null;
   s.result=currentContexts[id]?(semanticEdition?reasonSemantically(spec,s):evaluateKernel(spec,s)):encounterConsequence(id,spec.family==="tradeoff"?{ticks:[...s.ticks],motivation:s.motivation}:
    {resource:s.resource,barrier:s.barrier,action:s.action},memory);

  active.screen[id]="result";refreshCard(id);const end=document.querySelector(".result");
  end?.focus({preventScroll:true});end?.scrollIntoView({block:"start",behavior:"instant"});return;
 }
});
document.addEventListener("input",ev=>{
 const k=ev.target.closest("[data-k-slider]");
 if(k){
  const state=active.cases[active.mode],i=Number(k.dataset.i),kind=k.dataset.kSlider;
  const previous=kind==='amounts'?[...state.amounts]:null;
  state[kind][i]=Number(k.value);
  const m=currentContexts[active.mode].model;
  if(kind==='amounts'&&m.resources.length===1&&m.resources[0].type==='exact'&&m.choices.length===3&&
    m.choices.every(c=>c.cost[0]===1))
   state.amounts=reallocateVariableBudget(previous,i,Number(k.value));
  if(kind==="amounts"&&m.resources.length===1&&m.resources[0].type==="exact"&&m.choices.length===2&&m.choices.every(c=>c.cost[0]===1&&c.max>=state.budgets[0]))
   state.amounts[1-i]=state.budgets[0]-state.amounts[i];
  // Keep the active native range in place during touch dragging.
  const box=k.closest(".case-body");
  for(const el of box.querySelectorAll("[data-k-slider]")){
   el.value=state[el.dataset.kSlider][Number(el.dataset.i)];el.previousElementSibling.value=el.value;
  }
  const fresh=document.createElement("div");fresh.innerHTML=kernelControls(currentContexts[active.mode],state);
  box.querySelector("[aria-live]").textContent=fresh.querySelector("[aria-live]").textContent;
  const action=box.querySelector('[data-run], [data-test-allocation]');
  action.disabled=fresh.querySelector('[data-run], [data-test-allocation]').disabled;
  if(semanticEdition&&state.first){
   box.querySelector('.reconsider').innerHTML=fresh.querySelector('.reconsider').innerHTML;
   action.removeAttribute('data-test-allocation');action.setAttribute('data-run',active.mode);action.textContent='Reveal the meaning';
  }state.result=null;return;
 }
 const range=ev.target.closest("[data-range]");
 if(!range)return;
 const id=range.dataset.range,index=Number(range.dataset.index),state=active.cases[id];
 state.ticks=reallocateVariableBudget(state.ticks,index,Number(range.value));state.result=null;
 state.ticks.forEach((tick,i)=>{
  const el=$(id+"-range-"+i);if(el){el.value=String(tick);el.setAttribute("aria-valuetext",unit(tick/2)+" out of 3 hours");}
  const value=$(id+"-hour-"+i);if(value)value.textContent=unit(tick/2);
  const bar=document.querySelector('[data-bar="'+id+'"][data-index="'+i+'"]');
  if(bar)bar.style.width=(tick/6*100)+"%";
 });
 const result=document.querySelector('[data-id="'+id+'"] .result');
 if(result)result.remove();
});
if(semanticEdition){
 const nav=document.querySelector('.tabs');
 if(!founderEdition)nav.remove();
 else nav.innerHTML=Object.entries(currentContexts).map(([id,c])=>'<button data-mode="'+id+'">'+esc(c.author)+'</button>').join('');
 const requested=new URLSearchParams(location.hash.slice(1)).get('encounter');
 active.mode=Object.hasOwn(currentContexts,requested)?requested:'money';
}
render();

</script></body></html>
