<body>
  <section id="yl-onboarding" role="dialog" aria-modal="true" aria-label="YourLogos introduction" hidden></section>
  <div id="yl-entrance" class="yl-entrance" role="region" aria-label="Welcome to YourLogos">
    <div class="yl-entrance__content">
      <div class="yl-entrance__mark" aria-hidden="true"><img src="/icon.svg" width="84" height="84" alt="" draggable="false"/></div>
      <div class="yl-entrance__brand">YOURLOGOS</div>
      <div class="yl-daily" id="yl-daily" aria-label="A thought for today">
        <div class="yl-daily__eyebrow">TODAY'S LITTLE QUESTION</div>
        <div class="yl-daily__veil" aria-hidden="true">✦</div>
        <h1 class="yl-daily__thought" id="yl-daily-thought">What might you discover?</h1>
        <p class="yl-daily__source" id="yl-daily-source">A moment to notice something</p>
      </div>
      <div class="yl-slider" id="yl-slider" role="group" aria-label="Philosophy it: slide to enter">
        <div class="yl-slider__track" id="yl-slider-track" style="--progress:0%">
          <span class="yl-slider__fill" aria-hidden="true"></span>
          <span class="yl-slider__glint" aria-hidden="true"></span>
          <span class="yl-slider__motes" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="yl-slider__title" aria-hidden="true">Philosophy it</span>
          <span class="yl-slider__chevron" aria-hidden="true">›</span>
          <button id="yl-enter" class="yl-slider__thumb yl-entrance__button" type="button" role="slider" aria-label="Slide right with Little Logo to enter YourLogos" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Slide right to begin" disabled><img class="yl-slider__little-logo" src="/little-logo-hd-v2.jpg" width="400" height="400" alt="" decoding="async" draggable="false"/></button>
          <div class="yl-slider__particles" id="yl-slider-particles" aria-hidden="true"></div>
        </div>
        <p class="yl-slider__hint">LITTLE LOGO WILL FOLLOW YOUR LEAD</p>
      </div>
      <p id="yl-entrance-status" class="yl-entrance__status" role="status">Opening your space…</p>
      <button id="yl-retry" class="yl-entrance__retry" type="button" hidden>Try again</button>
    </div><div class="yl-entrance__foot">PHILOSOPHY, PRACTICED</div>
  </div>
  <div id="app" aria-live="polite">
    <div class="boot" role="status">YOURLOGOS <span>·</span> BE YOUR OWN PHILOSOPHER</div>
  </div>
  <noscript>YourLogos requires JavaScript for its daily practice.</noscript>
  <script type="module" src="/onboarding.js"></script>

  <script type="module" src="/app.js"></script>
  <script type="module" src="/little-logo-presence.js"></script>
